name: Validate Release Secrets

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Credentials to validate
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - gpg
          - gpg-windows
          - gpg-linux
          - launchpad
          - github
          - snap

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows-signing:
    name: Validate Windows signing certificate
    if: inputs.scope == 'all' || inputs.scope == 'windows'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout app metadata
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check PFX password, publisher, key, usage, and expiry
        shell: powershell
        env:
          MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Say([string]$text) {
            Write-Output $text
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('- `' + $text + '`')
          }
          function Fail([string]$text) {
            Write-Output "::error::$text"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('- FAIL: `' + $text + '`')
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($env:MSIX_PFX_BASE64)) { Fail "Missing secret: MSIX_PFX_BASE64" }
          if ([string]::IsNullOrWhiteSpace($env:MSIX_PFX_PASSWORD)) { Fail "Missing secret: MSIX_PFX_PASSWORD" }
          if (-not (Test-Path "app_metadata.json")) { Fail "app_metadata.json not found." }

          $meta = Get-Content "app_metadata.json" -Raw | ConvertFrom-Json
          $expectedPublisher = [string]$meta.msix_publisher
          if ([string]::IsNullOrWhiteSpace($expectedPublisher)) { Fail "Missing msix_publisher in app_metadata.json." }

          try {
            $bytes = [Convert]::FromBase64String($env:MSIX_PFX_BASE64.Trim())
            $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
            $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $bytes,
              $env:MSIX_PFX_PASSWORD,
              $flags
            )
          } catch {
            Fail "PFX could not be decoded or opened with MSIX_PFX_PASSWORD. Secret values were not printed."
          }

          Say "Subject: $($cert.Subject)"
          Say "Issuer: $($cert.Issuer)"
          Say "Self-signed: $($cert.Subject -eq $cert.Issuer)"
          Say "Serial number: $($cert.SerialNumber)"
          Say "Thumbprint (SHA-1): $($cert.Thumbprint)"
          Say "Signature algorithm: $($cert.SignatureAlgorithm.FriendlyName)"
          Say "Public key algorithm: $($cert.PublicKey.Oid.FriendlyName)"
          Say "msix_publisher in app_metadata.json: $expectedPublisher"

          if (-not $cert.HasPrivateKey) { Fail "PFX does not contain a private key." }

          if ($cert.Subject -ne $expectedPublisher) {
            Fail "Certificate subject does not match msix_publisher. Certificate: [$($cert.Subject)] Expected: [$expectedPublisher]"
          }
          Say "Subject matches msix_publisher: yes"

          $testBytes = [System.Text.Encoding]::UTF8.GetBytes("ImageMerge release signing validation")
          $sha256 = [System.Security.Cryptography.HashAlgorithmName]::SHA256
          $rsa = [System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPrivateKey($cert)
          $ecdsa = $null
          if ($null -eq $rsa) {
            $ecdsa = [System.Security.Cryptography.X509Certificates.ECDsaCertificateExtensions]::GetECDsaPrivateKey($cert)
          }

          try {
            if ($null -ne $rsa) {
              Say "Key size: $($rsa.KeySize) bits (RSA)"
              if ($rsa.KeySize -lt 2048) { Fail "RSA key is smaller than 2048 bits." }
              $padding = [System.Security.Cryptography.RSASignaturePadding]::Pkcs1
              $signature = $rsa.SignData($testBytes, $sha256, $padding)
              if (-not $rsa.VerifyData($testBytes, $signature, $sha256, $padding)) { Fail "Test signature did not verify." }
            } elseif ($null -ne $ecdsa) {
              Say "Key size: $($ecdsa.KeySize) bits (ECDSA)"
              $signature = $ecdsa.SignData($testBytes, $sha256)
              if (-not $ecdsa.VerifyData($testBytes, $signature, $sha256)) { Fail "Test signature did not verify." }
            } else {
              Fail "Private key type is not supported (expected RSA or ECDSA)."
            }
          } catch {
            Fail "Private key could not be used to create a test signature."
          }
          Say "Test signature with private key: ok"

          $basic = $cert.Extensions |
            Where-Object { $_ -is [System.Security.Cryptography.X509Certificates.X509BasicConstraintsExtension] } |
            Select-Object -First 1
          if ($null -ne $basic) {
            Say "Basic Constraints: CA=$($basic.CertificateAuthority)"
            if ($basic.CertificateAuthority) { Fail "Certificate is a CA certificate; a leaf code signing certificate is required." }
          } else {
            Say "Basic Constraints: not present"
          }

          $keyUsage = $cert.Extensions |
            Where-Object { $_ -is [System.Security.Cryptography.X509Certificates.X509KeyUsageExtension] } |
            Select-Object -First 1
          if ($null -ne $keyUsage) {
            Say "Key Usage: $($keyUsage.KeyUsages)"
            $digitalSignature = [System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::DigitalSignature
            if (($keyUsage.KeyUsages -band $digitalSignature) -ne $digitalSignature) {
              Fail "Key Usage does not include Digital Signature."
            }
          } else {
            Say "Key Usage: not present"
          }

          $codeSigningOid = "1.3.6.1.5.5.7.3.3"
          $ekuValues = @(
            $cert.Extensions |
              Where-Object { $_ -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] } |
              ForEach-Object { $_.EnhancedKeyUsages } |
              ForEach-Object { "$($_.FriendlyName) ($($_.Value))" }
          )
          Say "Enhanced Key Usage: $($ekuValues -join ', ')"
          $ekuOids = @(
            $cert.Extensions |
              Where-Object { $_ -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] } |
              ForEach-Object { $_.EnhancedKeyUsages } |
              ForEach-Object { $_.Value }
          )
          if ($codeSigningOid -notin $ekuOids) { Fail "Certificate does not include the Code Signing EKU." }

          $now = [DateTime]::UtcNow
          $notBefore = $cert.NotBefore.ToUniversalTime()
          $notAfter = $cert.NotAfter.ToUniversalTime()
          Say "Valid from: $($notBefore.ToString('u'))"
          Say "Valid until: $($notAfter.ToString('u'))"
          if ($notBefore -gt $now) { Fail "Certificate is not valid yet (starts $($notBefore.ToString('u')))." }
          if ($notAfter -le $now) { Fail "Certificate expired $($notAfter.ToString('u'))." }
          $daysRemaining = [int][Math]::Floor(($notAfter - $now).TotalDays)
          Say "Days remaining: $daysRemaining"
          if ($daysRemaining -lt 30) { Fail "Certificate expires in fewer than 30 days; renew it before a release." }

          $cert.Dispose()
          Say "Windows signing certificate: all checks passed."

  gpg-linux:
    name: Validate Linux release and Launchpad signing key
    if: inputs.scope == 'all' || inputs.scope == 'gpg' || inputs.scope == 'gpg-linux' || inputs.scope == 'launchpad'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KEY_LABEL: linux
      REQUIRE_KEYSERVER: "true"
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_LINUX }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE_LINUX }}
      EXPECTED_UID: ${{ vars.GPG_EXPECTED_UID_LINUX }}
    steps:
      - name: Check key identity, passphrase, signing, keyserver, and expiry
        shell: bash
        run: |
          set -euo pipefail

          say() {
            echo "[$KEY_LABEL] $*"
            printf -- '- `[%s] %s`\n' "$KEY_LABEL" "$*" >> "$GITHUB_STEP_SUMMARY"
          }
          warn() {
            echo "::warning::[$KEY_LABEL] $*"
            printf -- '- WARNING: `[%s] %s`\n' "$KEY_LABEL" "$*" >> "$GITHUB_STEP_SUMMARY"
          }
          fail() {
            echo "::error::[$KEY_LABEL] $*"
            printf -- '- FAIL: `[%s] %s`\n' "$KEY_LABEL" "$*" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          for name in GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            if [ -z "${!name}" ]; then
              fail "Missing secret for $name"
            fi
          done

          export GNUPGHOME="$RUNNER_TEMP/gpg-check-home-$KEY_LABEL"
          work="$RUNNER_TEMP/gpg-check-work-$KEY_LABEL"
          ks_home="$work/keyserver-home"
          install -d -m 700 "$GNUPGHOME" "$work" "$ks_home"
          trap 'gpgconf --kill gpg-agent >/dev/null 2>&1 || true; gpgconf --homedir "$ks_home" --kill gpg-agent >/dev/null 2>&1 || true; rm -rf "$GNUPGHOME" "$work"' EXIT

          if ! printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import >/dev/null 2>&1; then
            fail "Private key could not be imported."
          fi

          all_info="$(gpg --batch --with-colons --list-secret-keys 2>/dev/null || true)"
          primary_count="$(printf '%s\n' "$all_info" | grep -c '^sec:' || true)"
          if [ "$primary_count" -lt 1 ]; then
            fail "Imported data does not contain a private signing key."
          fi
          if [ "$primary_count" -gt 1 ]; then
            warn "Secret contains $primary_count primary keys; only the first one is validated."
          fi
          key_info="$(printf '%s\n' "$all_info" | awk -F: '$1=="sec"{n++} n==1')"

          fingerprint="$(printf '%s\n' "$key_info" | awk -F: '$1=="fpr"{print $10; exit}')"
          if [ -z "$fingerprint" ]; then
            fail "Could not determine the key fingerprint."
          fi
          fingerprint_upper="${fingerprint^^}"
          say "Fingerprint: $fingerprint_upper"
          say "Long key ID: ${fingerprint_upper: -16}"

          printf '%s\n' "$key_info" |
            awk -F: '$1=="uid"{print ($2==""?"-":$2), $10}' |
            while read -r validity uid_text; do
              say "UID: $uid_text (validity=$validity)"
            done

          printf '%s\n' "$key_info" |
            awk -F: '$1=="sec"||$1=="ssb"{print $1, ($2==""?"-":$2), $3, $4, $6, ($7==""?"0":$7), $12}' |
            while read -r kind validity bits algo created expires caps; do
              created_date="$(date -u -d "@$created" '+%Y-%m-%d')"
              if [ "$expires" = "0" ]; then
                expires_date="never"
              else
                expires_date="$(date -u -d "@$expires" '+%Y-%m-%d')"
              fi
              say "$kind: algo=$algo bits=$bits created=$created_date expires=$expires_date capabilities=$caps validity=$validity"
            done

          primary_validity="$(printf '%s\n' "$key_info" | awk -F: '$1=="sec"{print $2; exit}')"
          case "$primary_validity" in
            r) fail "Primary key is revoked." ;;
            e) fail "Primary key is expired." ;;
          esac

          weak_keys="$(printf '%s\n' "$key_info" | awk -F: '($1=="sec"||$1=="ssb") && $4==1 && $3<2048{print $3}')"
          if [ -n "$weak_keys" ]; then
            fail "RSA key smaller than 2048 bits found."
          fi

          signing_lines="$(printf '%s\n' "$key_info" | awk -F: '($1=="sec"||$1=="ssb") && $12 ~ /s/ && $2!="r" && $2!="e"{print ($7==""?"0":$7)}')"
          if [ -z "$signing_lines" ]; then
            fail "No usable (non-revoked, non-expired) signing-capable key found."
          fi

          active_uids="$(printf '%s\n' "$key_info" | awk -F: '$1=="uid" && $2!="r" && $2!="e"{print $10}')"
          if [ -z "$active_uids" ]; then
            fail "No active user ID found on the key."
          fi

          if [ -z "$EXPECTED_UID" ]; then
            warn "Expected UID is not configured; set the repository variable for this key to verify name and email."
          elif printf '%s\n' "$active_uids" | grep -Fxq -- "$EXPECTED_UID"; then
            say "UID matches expected value: yes ($EXPECTED_UID)"
          else
            fail "No active UID matches the expected value [$EXPECTED_UID]."
          fi

          pass_file="$work/passphrase"
          data_file="$work/data.txt"
          sig_file="$work/data.txt.asc"
          umask 077
          printf '%s' "$GPG_PASSPHRASE" > "$pass_file"
          printf 'ImageMerge release signing validation\n' > "$data_file"

          if ! gpg --batch --yes --pinentry-mode loopback --passphrase-file "$pass_file" \
              --local-user "$fingerprint" --armor --detach-sign --output "$sig_file" "$data_file" >/dev/null 2>&1; then
            fail "Passphrase is invalid or the signing key cannot be used."
          fi
          verify_out="$(gpg --batch --status-fd 1 --verify "$sig_file" "$data_file" 2>/dev/null || true)"
          validsig="$(printf '%s\n' "$verify_out" | awk '$2=="VALIDSIG"{print $3, $NF; exit}')"
          if [ -z "$validsig" ]; then
            fail "Test signature was created but did not verify."
          fi
          signed_with="$(printf '%s' "$validsig" | awk '{print toupper($1)}')"
          signed_primary="$(printf '%s' "$validsig" | awk '{print toupper($2)}')"
          say "Test signature: created and verified (signing key $signed_with, primary $signed_primary)"

          ks_file="$work/keyserver.asc"
          fetched=0
          for attempt in 1 2 3; do
            if curl -fsS --max-time 20 -o "$ks_file" \
                "https://keyserver.ubuntu.com/pks/lookup?op=get&options=mr&search=0x${fingerprint_upper}" 2>/dev/null &&
               grep -q 'BEGIN PGP PUBLIC KEY BLOCK' "$ks_file"; then
              fetched=1
              break
            fi
            sleep 5
          done

          mismatch() {
            if [ "$REQUIRE_KEYSERVER" = "true" ]; then fail "$*"; else warn "$*"; fi
          }
          fmt_date() {
            if [ "$1" = "0" ] || [ -z "$1" ]; then echo "never"; else date -u -d "@$1" '+%Y-%m-%d'; fi
          }
          key_expiries() {
            awk -F: '$1=="pub"||$1=="sub"{e=($7==""?"0":$7);want=1;next} $1=="fpr"&&want{print toupper($10), e;want=0}'
          }
          uid_list() {
            awk -F: '$1=="uid" && $2!="r" && $2!="e"{print $10}' | LC_ALL=C sort -u
          }

          if [ "$fetched" -ne 1 ]; then
            mismatch "Public key was not found on keyserver.ubuntu.com."
          else
            if ! gpg --homedir "$ks_home" --batch --import "$ks_file" >/dev/null 2>&1; then
              fail "Key downloaded from keyserver.ubuntu.com could not be imported."
            fi

            local_pub="$(gpg --batch --with-colons --list-keys "$fingerprint_upper" 2>/dev/null || true)"
            ks_pub="$(gpg --homedir "$ks_home" --batch --with-colons --list-keys "$fingerprint_upper" 2>/dev/null || true)"

            ks_primary="$(printf '%s\n' "$ks_pub" | awk -F: '$1=="fpr"{print toupper($10); exit}')"
            if [ "$ks_primary" != "$fingerprint_upper" ]; then
              fail "Keyserver primary fingerprint [$ks_primary] does not match the secret key [$fingerprint_upper]."
            fi
            say "Keyserver fingerprint matches secret key: yes"

            ks_validity="$(printf '%s\n' "$ks_pub" | awk -F: '$1=="pub"{print $2; exit}')"
            case "$ks_validity" in
              r) fail "Public key on keyserver.ubuntu.com is revoked." ;;
              e) fail "Public key on keyserver.ubuntu.com is expired." ;;
            esac

            ks_verify="$(gpg --homedir "$ks_home" --batch --status-fd 1 --verify "$sig_file" "$data_file" 2>/dev/null || true)"
            if printf '%s\n' "$ks_verify" | awk '$2=="VALIDSIG"{f=1} END{exit !f}'; then
              say "Keyserver public key verifies the test signature: yes"
            else
              fail "Keyserver public key cannot verify a signature made with the secret key (stale or different key on keyserver)."
            fi

            local_exp="$(printf '%s\n' "$local_pub" | key_expiries)"
            ks_exp="$(printf '%s\n' "$ks_pub" | key_expiries)"
            for f in $(printf '%s\n%s\n' "$fingerprint_upper" "$signed_with" | sort -u); do
              l="$(printf '%s\n' "$local_exp" | awk -v f="$f" '$1==f{print $2; exit}')"
              k="$(printf '%s\n' "$ks_exp" | awk -v f="$f" '$1==f{print $2; exit}')"
              if [ -z "$k" ]; then
                mismatch "Key $f is missing on keyserver."
              elif [ "$l" != "$k" ]; then
                mismatch "Expiry of $f differs: local=$(fmt_date "$l") keyserver=$(fmt_date "$k"). Upload the updated public key."
              else
                say "Expiry of $f matches keyserver: $(fmt_date "$l")"
              fi
            done

            local_uids="$(printf '%s\n' "$local_pub" | uid_list)"
            ks_uids="$(printf '%s\n' "$ks_pub" | uid_list)"
            while IFS= read -r u; do
              if [ -n "$u" ]; then mismatch "UID is in the secret key but missing on keyserver: $u"; fi
            done < <(LC_ALL=C comm -23 <(printf '%s\n' "$local_uids") <(printf '%s\n' "$ks_uids"))
            while IFS= read -r u; do
              if [ -n "$u" ]; then warn "UID is on keyserver but not in the secret key: $u"; fi
            done < <(LC_ALL=C comm -13 <(printf '%s\n' "$local_uids") <(printf '%s\n' "$ks_uids"))
            say "Keyserver UIDs: $(printf '%s' "$ks_uids" | tr '\n' ';')"
          fi

          primary_exp="$(printf '%s\n' "$key_info" | awk -F: '$1=="sec"{print $7; exit}')"
          primary_exp="${primary_exp:-0}"
          sign_exp=""
          no_expiry=0
          for e in $signing_lines; do
            if [ "$e" = "0" ]; then
              no_expiry=1
            elif [ -z "$sign_exp" ] || [ "$e" -gt "$sign_exp" ]; then
              sign_exp="$e"
            fi
          done
          if [ "$no_expiry" -eq 1 ]; then
            sign_exp=0
          fi
          sign_exp="${sign_exp:-0}"
          effective="$sign_exp"
          if [ "$primary_exp" != "0" ]; then
            if [ "$effective" = "0" ] || [ "$primary_exp" -lt "$effective" ]; then
              effective="$primary_exp"
            fi
          fi

          if [ "$effective" = "0" ]; then
            say "Signing key expiry: no expiration date is set."
          else
            now="$(date +%s)"
            days_remaining=$(( (effective - now) / 86400 ))
            expiry_date="$(date -u -d "@$effective" '+%Y-%m-%d %H:%M UTC')"
            if [ "$days_remaining" -le 0 ]; then
              fail "Signing capability expired: $expiry_date"
            fi
            say "Signing key expiry: $expiry_date ($days_remaining days remaining)"
            if [ "$days_remaining" -lt 30 ]; then
              fail "Signing key expires in fewer than 30 days; renew it before a release."
            fi
          fi

          say "GPG key (linux): all checks passed."

  gpg-win:
    name: Validate Windows release signing key
    if: inputs.scope == 'all' || inputs.scope == 'gpg' || inputs.scope == 'gpg-windows'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KEY_LABEL: windows
      REQUIRE_KEYSERVER: "false"
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_WIN }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE_WIN }}
      EXPECTED_UID: ${{ vars.GPG_EXPECTED_UID_WIN }}
    steps:
      - name: Check key identity, passphrase, signing, keyserver, and expiry
        shell: bash
        run: |
          set -euo pipefail

          say() {
            echo "[$KEY_LABEL] $*"
            printf -- '- `[%s] %s`\n' "$KEY_LABEL" "$*" >> "$GITHUB_STEP_SUMMARY"
          }
          warn() {
            echo "::warning::[$KEY_LABEL] $*"
            printf -- '- WARNING: `[%s] %s`\n' "$KEY_LABEL" "$*" >> "$GITHUB_STEP_SUMMARY"
          }
          fail() {
            echo "::error::[$KEY_LABEL] $*"
            printf -- '- FAIL: `[%s] %s`\n' "$KEY_LABEL" "$*" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          for name in GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            if [ -z "${!name}" ]; then
              fail "Missing secret for $name"
            fi
          done

          export GNUPGHOME="$RUNNER_TEMP/gpg-check-home-$KEY_LABEL"
          work="$RUNNER_TEMP/gpg-check-work-$KEY_LABEL"
          ks_home="$work/keyserver-home"
          install -d -m 700 "$GNUPGHOME" "$work" "$ks_home"
          trap 'gpgconf --kill gpg-agent >/dev/null 2>&1 || true; gpgconf --homedir "$ks_home" --kill gpg-agent >/dev/null 2>&1 || true; rm -rf "$GNUPGHOME" "$work"' EXIT

          if ! printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import >/dev/null 2>&1; then
            fail "Private key could not be imported."
          fi

          all_info="$(gpg --batch --with-colons --list-secret-keys 2>/dev/null || true)"
          primary_count="$(printf '%s\n' "$all_info" | grep -c '^sec:' || true)"
          if [ "$primary_count" -lt 1 ]; then
            fail "Imported data does not contain a private signing key."
          fi
          if [ "$primary_count" -gt 1 ]; then
            warn "Secret contains $primary_count primary keys; only the first one is validated."
          fi
          key_info="$(printf '%s\n' "$all_info" | awk -F: '$1=="sec"{n++} n==1')"

          fingerprint="$(printf '%s\n' "$key_info" | awk -F: '$1=="fpr"{print $10; exit}')"
          if [ -z "$fingerprint" ]; then
            fail "Could not determine the key fingerprint."
          fi
          fingerprint_upper="${fingerprint^^}"
          say "Fingerprint: $fingerprint_upper"
          say "Long key ID: ${fingerprint_upper: -16}"

          printf '%s\n' "$key_info" |
            awk -F: '$1=="uid"{print ($2==""?"-":$2), $10}' |
            while read -r validity uid_text; do
              say "UID: $uid_text (validity=$validity)"
            done

          printf '%s\n' "$key_info" |
            awk -F: '$1=="sec"||$1=="ssb"{print $1, ($2==""?"-":$2), $3, $4, $6, ($7==""?"0":$7), $12}' |
            while read -r kind validity bits algo created expires caps; do
              created_date="$(date -u -d "@$created" '+%Y-%m-%d')"
              if [ "$expires" = "0" ]; then
                expires_date="never"
              else
                expires_date="$(date -u -d "@$expires" '+%Y-%m-%d')"
              fi
              say "$kind: algo=$algo bits=$bits created=$created_date expires=$expires_date capabilities=$caps validity=$validity"
            done

          primary_validity="$(printf '%s\n' "$key_info" | awk -F: '$1=="sec"{print $2; exit}')"
          case "$primary_validity" in
            r) fail "Primary key is revoked." ;;
            e) fail "Primary key is expired." ;;
          esac

          weak_keys="$(printf '%s\n' "$key_info" | awk -F: '($1=="sec"||$1=="ssb") && $4==1 && $3<2048{print $3}')"
          if [ -n "$weak_keys" ]; then
            fail "RSA key smaller than 2048 bits found."
          fi

          signing_lines="$(printf '%s\n' "$key_info" | awk -F: '($1=="sec"||$1=="ssb") && $12 ~ /s/ && $2!="r" && $2!="e"{print ($7==""?"0":$7)}')"
          if [ -z "$signing_lines" ]; then
            fail "No usable (non-revoked, non-expired) signing-capable key found."
          fi

          active_uids="$(printf '%s\n' "$key_info" | awk -F: '$1=="uid" && $2!="r" && $2!="e"{print $10}')"
          if [ -z "$active_uids" ]; then
            fail "No active user ID found on the key."
          fi

          if [ -z "$EXPECTED_UID" ]; then
            warn "Expected UID is not configured; set the repository variable for this key to verify name and email."
          elif printf '%s\n' "$active_uids" | grep -Fxq -- "$EXPECTED_UID"; then
            say "UID matches expected value: yes ($EXPECTED_UID)"
          else
            fail "No active UID matches the expected value [$EXPECTED_UID]."
          fi

          pass_file="$work/passphrase"
          data_file="$work/data.txt"
          sig_file="$work/data.txt.asc"
          umask 077
          printf '%s' "$GPG_PASSPHRASE" > "$pass_file"
          printf 'ImageMerge release signing validation\n' > "$data_file"

          if ! gpg --batch --yes --pinentry-mode loopback --passphrase-file "$pass_file" \
              --local-user "$fingerprint" --armor --detach-sign --output "$sig_file" "$data_file" >/dev/null 2>&1; then
            fail "Passphrase is invalid or the signing key cannot be used."
          fi
          verify_out="$(gpg --batch --status-fd 1 --verify "$sig_file" "$data_file" 2>/dev/null || true)"
          validsig="$(printf '%s\n' "$verify_out" | awk '$2=="VALIDSIG"{print $3, $NF; exit}')"
          if [ -z "$validsig" ]; then
            fail "Test signature was created but did not verify."
          fi
          signed_with="$(printf '%s' "$validsig" | awk '{print toupper($1)}')"
          signed_primary="$(printf '%s' "$validsig" | awk '{print toupper($2)}')"
          say "Test signature: created and verified (signing key $signed_with, primary $signed_primary)"

          ks_file="$work/keyserver.asc"
          fetched=0
          for attempt in 1 2 3; do
            if curl -fsS --max-time 20 -o "$ks_file" \
                "https://keyserver.ubuntu.com/pks/lookup?op=get&options=mr&search=0x${fingerprint_upper}" 2>/dev/null &&
               grep -q 'BEGIN PGP PUBLIC KEY BLOCK' "$ks_file"; then
              fetched=1
              break
            fi
            sleep 5
          done

          mismatch() {
            if [ "$REQUIRE_KEYSERVER" = "true" ]; then fail "$*"; else warn "$*"; fi
          }
          fmt_date() {
            if [ "$1" = "0" ] || [ -z "$1" ]; then echo "never"; else date -u -d "@$1" '+%Y-%m-%d'; fi
          }
          key_expiries() {
            awk -F: '$1=="pub"||$1=="sub"{e=($7==""?"0":$7);want=1;next} $1=="fpr"&&want{print toupper($10), e;want=0}'
          }
          uid_list() {
            awk -F: '$1=="uid" && $2!="r" && $2!="e"{print $10}' | LC_ALL=C sort -u
          }

          if [ "$fetched" -ne 1 ]; then
            mismatch "Public key was not found on keyserver.ubuntu.com."
          else
            if ! gpg --homedir "$ks_home" --batch --import "$ks_file" >/dev/null 2>&1; then
              fail "Key downloaded from keyserver.ubuntu.com could not be imported."
            fi

            local_pub="$(gpg --batch --with-colons --list-keys "$fingerprint_upper" 2>/dev/null || true)"
            ks_pub="$(gpg --homedir "$ks_home" --batch --with-colons --list-keys "$fingerprint_upper" 2>/dev/null || true)"

            ks_primary="$(printf '%s\n' "$ks_pub" | awk -F: '$1=="fpr"{print toupper($10); exit}')"
            if [ "$ks_primary" != "$fingerprint_upper" ]; then
              fail "Keyserver primary fingerprint [$ks_primary] does not match the secret key [$fingerprint_upper]."
            fi
            say "Keyserver fingerprint matches secret key: yes"

            ks_validity="$(printf '%s\n' "$ks_pub" | awk -F: '$1=="pub"{print $2; exit}')"
            case "$ks_validity" in
              r) fail "Public key on keyserver.ubuntu.com is revoked." ;;
              e) fail "Public key on keyserver.ubuntu.com is expired." ;;
            esac

            ks_verify="$(gpg --homedir "$ks_home" --batch --status-fd 1 --verify "$sig_file" "$data_file" 2>/dev/null || true)"
            if printf '%s\n' "$ks_verify" | awk '$2=="VALIDSIG"{f=1} END{exit !f}'; then
              say "Keyserver public key verifies the test signature: yes"
            else
              fail "Keyserver public key cannot verify a signature made with the secret key (stale or different key on keyserver)."
            fi

            local_exp="$(printf '%s\n' "$local_pub" | key_expiries)"
            ks_exp="$(printf '%s\n' "$ks_pub" | key_expiries)"
            for f in $(printf '%s\n%s\n' "$fingerprint_upper" "$signed_with" | sort -u); do
              l="$(printf '%s\n' "$local_exp" | awk -v f="$f" '$1==f{print $2; exit}')"
              k="$(printf '%s\n' "$ks_exp" | awk -v f="$f" '$1==f{print $2; exit}')"
              if [ -z "$k" ]; then
                mismatch "Key $f is missing on keyserver."
              elif [ "$l" != "$k" ]; then
                mismatch "Expiry of $f differs: local=$(fmt_date "$l") keyserver=$(fmt_date "$k"). Upload the updated public key."
              else
                say "Expiry of $f matches keyserver: $(fmt_date "$l")"
              fi
            done

            local_uids="$(printf '%s\n' "$local_pub" | uid_list)"
            ks_uids="$(printf '%s\n' "$ks_pub" | uid_list)"
            while IFS= read -r u; do
              if [ -n "$u" ]; then mismatch "UID is in the secret key but missing on keyserver: $u"; fi
            done < <(LC_ALL=C comm -23 <(printf '%s\n' "$local_uids") <(printf '%s\n' "$ks_uids"))
            while IFS= read -r u; do
              if [ -n "$u" ]; then warn "UID is on keyserver but not in the secret key: $u"; fi
            done < <(LC_ALL=C comm -13 <(printf '%s\n' "$local_uids") <(printf '%s\n' "$ks_uids"))
            say "Keyserver UIDs: $(printf '%s' "$ks_uids" | tr '\n' ';')"
          fi

          primary_exp="$(printf '%s\n' "$key_info" | awk -F: '$1=="sec"{print $7; exit}')"
          primary_exp="${primary_exp:-0}"
          sign_exp=""
          no_expiry=0
          for e in $signing_lines; do
            if [ "$e" = "0" ]; then
              no_expiry=1
            elif [ -z "$sign_exp" ] || [ "$e" -gt "$sign_exp" ]; then
              sign_exp="$e"
            fi
          done
          if [ "$no_expiry" -eq 1 ]; then
            sign_exp=0
          fi
          sign_exp="${sign_exp:-0}"
          effective="$sign_exp"
          if [ "$primary_exp" != "0" ]; then
            if [ "$effective" = "0" ] || [ "$primary_exp" -lt "$effective" ]; then
              effective="$primary_exp"
            fi
          fi

          if [ "$effective" = "0" ]; then
            say "Signing key expiry: no expiration date is set."
          else
            now="$(date +%s)"
            days_remaining=$(( (effective - now) / 86400 ))
            expiry_date="$(date -u -d "@$effective" '+%Y-%m-%d %H:%M UTC')"
            if [ "$days_remaining" -le 0 ]; then
              fail "Signing capability expired: $expiry_date"
            fi
            say "Signing key expiry: $expiry_date ($days_remaining days remaining)"
            if [ "$days_remaining" -lt 30 ]; then
              fail "Signing key expires in fewer than 30 days; renew it before a release."
            fi
          fi

          say "GPG key (windows): all checks passed."

  github-tokens:
    name: Validate GitHub publishing tokens
    if: inputs.scope == 'all' || inputs.scope == 'github'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
      FLATHUB_GITHUB_TOKEN: ${{ secrets.FLATHUB_GITHUB_TOKEN }}
      HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      FLATHUB_TARGET_REPO: ${{ vars.FLATHUB_TARGET_REPO }}
      FLATHUB_BASE_REPO: ${{ vars.FLATHUB_BASE_REPO }}
      HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
      HOMEBREW_TAP_BASE_REPO: ${{ vars.HOMEBREW_TAP_BASE_REPO }}
    steps:
      - name: Verify token identity, expiry, and repository access without publishing
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          LAST_LOGIN=""

          say() {
            echo "$*"
            printf -- '- `%s`\n' "$*" >> "$GITHUB_STEP_SUMMARY"
          }
          warn() {
            echo "::warning::$*"
            printf -- '- WARNING: `%s`\n' "$*" >> "$GITHUB_STEP_SUMMARY"
          }
          bad() {
            echo "::error::$*"
            printf -- '- FAIL: `%s`\n' "$*" >> "$GITHUB_STEP_SUMMARY"
            failed=1
          }

          check_identity() {
            local name="$1"
            local token="$2"
            local headers login scopes expiry expiry_epoch days
            LAST_LOGIN=""
            if [ -z "$token" ]; then
              bad "$name: MISSING"
              return 1
            fi
            if ! headers="$(GH_TOKEN="$token" gh api -i user 2>/dev/null)"; then
              bad "$name: INVALID, revoked, or expired (GitHub API authentication failed)"
              return 1
            fi
            login="$(GH_TOKEN="$token" gh api user --jq .login 2>/dev/null || true)"
            LAST_LOGIN="$login"
            say "$name: valid for GitHub account @$login"

            if printf '%s\n' "$headers" | tr -d '\r' | grep -qi '^x-oauth-scopes:'; then
              scopes="$(printf '%s\n' "$headers" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-oauth-scopes"{print $2; exit}')"
              say "$name: classic token scopes: ${scopes:-none}"
            else
              say "$name: fine-grained or app token (no classic scopes reported)"
            fi

            expiry="$(printf '%s\n' "$headers" | tr -d '\r' | awk -F': ' 'tolower($1)=="github-authentication-token-expiration"{print $2; exit}')"
            if [ -n "$expiry" ]; then
              expiry_epoch="$(date -u -d "$expiry" +%s 2>/dev/null || true)"
              if [ -n "$expiry_epoch" ]; then
                days=$(( (expiry_epoch - $(date +%s)) / 86400 ))
                say "$name: expires $expiry ($days days remaining)"
                if [ "$days" -lt 30 ]; then
                  bad "$name: expires in fewer than 30 days; renew it before a release."
                fi
              else
                warn "$name: expiration header could not be parsed: $expiry"
              fi
            else
              say "$name: no expiration reported (token has no expiry)"
            fi
            return 0
          }

          check_write_access() {
            local name="$1"
            local token="$2"
            local repo="$3"
            local base="$4"
            local info push parent
            if ! info="$(GH_TOKEN="$token" gh api "repos/$repo" --jq '[(.permissions.push // false), (.parent.full_name // "none")] | @tsv' 2>/dev/null)"; then
              bad "$name: cannot read $repo"
              return
            fi
            push="$(printf '%s' "$info" | cut -f1)"
            parent="$(printf '%s' "$info" | cut -f2)"
            if [ "$push" != "true" ]; then
              bad "$name: token has no push access to $repo"
              return
            fi
            say "$name: push access to $repo (fork parent: $parent)"
            if [ -n "$base" ]; then
              if [ "$parent" = "none" ]; then
                warn "$name: $repo is not a fork; expected a fork of $base"
              elif [ "${parent,,}" != "${base,,}" ]; then
                bad "$name: $repo is a fork of $parent, expected $base"
              fi
            fi
            say "$name: confirm the PAT itself grants Contents: read/write (and Pull requests: write if used) for $repo"
          }

          check_read_access() {
            local name="$1"
            local token="$2"
            local repo="$3"
            if ! GH_TOKEN="$token" gh api "repos/$repo" --silent >/dev/null 2>&1; then
              bad "$name: cannot access base repository $repo"
            else
              say "$name: base repository $repo is accessible"
            fi
          }

          if check_identity WINGET_GITHUB_TOKEN "$WINGET_GITHUB_TOKEN"; then
            winget_login="$LAST_LOGIN"
            check_read_access WINGET_GITHUB_TOKEN "$WINGET_GITHUB_TOKEN" "microsoft/winget-pkgs"
            if GH_TOKEN="$WINGET_GITHUB_TOKEN" gh api "repos/$winget_login/winget-pkgs" --silent >/dev/null 2>&1; then
              check_write_access WINGET_GITHUB_TOKEN "$WINGET_GITHUB_TOKEN" "$winget_login/winget-pkgs" "microsoft/winget-pkgs"
            else
              warn "WINGET_GITHUB_TOKEN: no winget-pkgs fork exists yet; the publisher must create it, which is not verified here."
            fi
          fi

          if check_identity FLATHUB_GITHUB_TOKEN "$FLATHUB_GITHUB_TOKEN"; then
            flathub_target="${FLATHUB_TARGET_REPO:-${GITHUB_REPOSITORY_OWNER}/flathub}"
            flathub_base="${FLATHUB_BASE_REPO:-flathub/flathub}"
            say "FLATHUB_GITHUB_TOKEN: target repo $flathub_target, base repo $flathub_base"
            check_write_access FLATHUB_GITHUB_TOKEN "$FLATHUB_GITHUB_TOKEN" "$flathub_target" "$flathub_base"
            check_read_access FLATHUB_GITHUB_TOKEN "$FLATHUB_GITHUB_TOKEN" "$flathub_base"
          fi

          tap_repo="${HOMEBREW_TAP_REPO:-${GITHUB_REPOSITORY_OWNER}/homebrew-tap}"
          if [ -n "$HOMEBREW_TAP_GITHUB_TOKEN" ]; then
            if check_identity HOMEBREW_TAP_GITHUB_TOKEN "$HOMEBREW_TAP_GITHUB_TOKEN"; then
              tap_base="${HOMEBREW_TAP_BASE_REPO:-$tap_repo}"
              say "HOMEBREW_TAP_GITHUB_TOKEN: tap repo $tap_repo, base repo $tap_base"
              check_write_access HOMEBREW_TAP_GITHUB_TOKEN "$HOMEBREW_TAP_GITHUB_TOKEN" "$tap_repo" ""
              check_read_access HOMEBREW_TAP_GITHUB_TOKEN "$HOMEBREW_TAP_GITHUB_TOKEN" "$tap_base"
            fi
          else
            if [ "$tap_repo" = "$GITHUB_REPOSITORY" ]; then
              say "HOMEBREW_TAP_GITHUB_TOKEN: not needed; the tap is this repository and the workflow GITHUB_TOKEN is used."
            else
              bad "HOMEBREW_TAP_GITHUB_TOKEN: MISSING for external tap $tap_repo"
            fi
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          say "GitHub tokens: all checks passed."

  snap-credentials:
    name: Validate Snap Store credentials
    if: inputs.scope == 'all' || inputs.scope == 'snap'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install snapcraft
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v snapcraft >/dev/null 2>&1; then
            sudo snap install snapcraft --classic
          fi

      - name: Verify Store login, permissions, and expiry without uploading
        shell: bash
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail

          say() {
            echo "$*"
            printf -- '- `%s`\n' "$*" >> "$GITHUB_STEP_SUMMARY"
          }
          warn() {
            echo "::warning::$*"
            printf -- '- WARNING: `%s`\n' "$*" >> "$GITHUB_STEP_SUMMARY"
          }
          fail() {
            echo "::error::$*"
            printf -- '- FAIL: `%s`\n' "$*" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            fail "Missing secret: SNAPCRAFT_STORE_CREDENTIALS"
          fi

          whoami_log="$RUNNER_TEMP/snapcraft-whoami.log"
          trap 'rm -f "$whoami_log"' EXIT

          if ! snapcraft whoami >"$whoami_log" 2>&1; then
            fail "Snap Store credentials were rejected or are no longer valid."
          fi
          say "Snap Store credentials: accepted by Snapcraft; no package was uploaded."

          if [ "${REPO_PRIVATE:-}" = "true" ]; then
            display="$(cat "$whoami_log")"
          else
            display="$(awk '/^[A-Za-z_-]+:/{split($0,a,":"); show=(a[1]=="permissions"||a[1]=="channels"||a[1]=="packages"||a[1]=="expires")} show' "$whoami_log")"
            say "Account identity lines are hidden because this repository is public."
          fi
          while IFS= read -r line; do
            if [ -n "$line" ]; then say "whoami: $line"; fi
          done <<< "$display"

          if grep -Eq 'package_push|package_release|package_upload' "$whoami_log"; then
            say "Permissions: upload or release permission present"
          else
            warn "Could not confirm upload or release permission from whoami output."
          fi

          expires="$(awk -F': *' '/^expires:/{print $2; exit}' "$whoami_log")"
          if [ -n "$expires" ]; then
            expires_clean="${expires%%.*}"
            expires_clean="${expires_clean%%Z}"
            if expiry_epoch="$(date -u -d "${expires_clean}Z" +%s 2>/dev/null)"; then
              days=$(( (expiry_epoch - $(date +%s)) / 86400 ))
              say "Credentials expire: $expires ($days days remaining)"
              if [ "$days" -le 0 ]; then
                fail "Snap Store credentials have expired."
              fi
              if [ "$days" -lt 30 ]; then
                fail "Snap Store credentials expire in fewer than 30 days; rotate them before a release."
              fi
            else
              warn "Could not parse credential expiry: $expires"
            fi
          else
            warn "No expiry reported by snapcraft whoami; rotate credentials if revoked or account access changes."
          fi

          say "Snap Store credentials: all checks passed."