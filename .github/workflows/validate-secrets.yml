name: Validate Release Secrets

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Credentials to validate
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - gpg
          - gpg-windows
          - gpg-linux
          - launchpad
          - github
          - snap

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows-signing:
    name: Validate Windows signing certificate
    if: inputs.scope == 'all' || inputs.scope == 'windows'
    runs-on: windows-latest
    env:
      MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
      MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
    steps:
      - name: Checkout app metadata
        uses: actions/checkout@v5

      - name: Check PFX password, publisher, purpose, and expiry
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:MSIX_PFX_BASE64)) { throw "Missing secret: MSIX_PFX_BASE64" }
          if ([string]::IsNullOrWhiteSpace($env:MSIX_PFX_PASSWORD)) { throw "Missing secret: MSIX_PFX_PASSWORD" }
          $meta = Get-Content "app_metadata.json" -Raw | ConvertFrom-Json
          $expectedPublisher = [string]$meta.msix_publisher
          if ([string]::IsNullOrWhiteSpace($expectedPublisher)) { throw "Missing msix_publisher in app_metadata.json." }

          try {
            $bytes = [Convert]::FromBase64String($env:MSIX_PFX_BASE64.Trim())
            $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
            $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $bytes,
              $env:MSIX_PFX_PASSWORD,
              $flags
            )
          } catch {
            throw "PFX could not be decoded or opened with MSIX_PFX_PASSWORD. The secret values were not printed."
          }

          if (-not $cert.HasPrivateKey) { throw "PFX does not contain a private key." }
          if ($cert.Subject -ne $expectedPublisher) {
            throw "Certificate subject does not match msix_publisher in app_metadata.json."
          }

          $codeSigningOid = "1.3.6.1.5.5.7.3.3"
          $eku = $cert.Extensions |
            Where-Object { $_.Oid.Value -eq "2.5.29.37" } |
            ForEach-Object { $_.EnhancedKeyUsages } |
            ForEach-Object { $_.Value }
          if ($codeSigningOid -notin $eku) { throw "Certificate does not include the Code Signing EKU." }

          $now = [DateTime]::UtcNow
          $notBefore = $cert.NotBefore.ToUniversalTime()
          $notAfter = $cert.NotAfter.ToUniversalTime()
          if ($notBefore -gt $now) { throw "Certificate is not valid yet (starts $($notBefore.ToString('u')))." }
          if ($notAfter -le $now) { throw "Certificate expired $($notAfter.ToString('u'))." }
          $daysRemaining = [int][Math]::Floor(($notAfter - $now).TotalDays)
          Write-Output "Windows signing certificate: valid; expires $($notAfter.ToString('u')) ($daysRemaining days remaining)."
          if ($daysRemaining -lt 30) { throw "Certificate expires in fewer than 30 days; renew it before a release." }

          $cert.Dispose()

  gpg-linux:
    name: Validate Linux release and Launchpad signing key
    if: inputs.scope == 'all' || inputs.scope == 'gpg' || inputs.scope == 'gpg-linux' || inputs.scope == 'launchpad'
    runs-on: ubuntu-latest
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_LINUX }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE_LINUX }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID_LINUX }}
    steps:
      - name: Check private key, passphrase, and expiry
        shell: bash
        run: |
          set -euo pipefail
          for name in GPG_PRIVATE_KEY GPG_PASSPHRASE GPG_KEY_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name"
              exit 1
            fi
          done

          export GNUPGHOME="$RUNNER_TEMP/release-secret-check-gnupg"
          install -d -m 700 "$GNUPGHOME"
          signature="$RUNNER_TEMP/release-secret-check.sig"
          trap 'rm -rf "$GNUPGHOME" "$signature"' EXIT

          if ! printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import >/dev/null 2>&1; then
            echo "GPG_PRIVATE_KEY could not be imported."
            exit 1
          fi
          key_info="$(gpg --batch --with-colons --list-secret-keys "$GPG_KEY_ID" 2>/dev/null)" || {
            echo "GPG_KEY_ID does not match an imported secret key."
            exit 1
          }
          if ! printf '%s\n' "$key_info" | grep -q '^sec:'; then
            echo "GPG_KEY_ID does not identify a private signing key."
            exit 1
          fi

          printf 'ImageMerge release signing validation\n' |
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --local-user "$GPG_KEY_ID" --armor --detach-sign --output "$signature" >/dev/null 2>&1 || {
                echo "GPG key selection or passphrase is invalid."
                exit 1
              }

          expiry="$(printf '%s\n' "$key_info" | awk -F: '($1 == "sec" || $1 == "ssb") && $12 ~ /s/ { if ($7 != "" && $7 != "0") print $7 }' | sort -n | head -n 1)"
          if [ -z "$expiry" ]; then
            echo "GPG signing key: usable; no expiration date is set."
          else
            now="$(date +%s)"
            days_remaining=$(( (expiry - now) / 86400 ))
            expiry_date="$(date -u -d "@$expiry" '+%Y-%m-%d %H:%M UTC')"
            if [ "$days_remaining" -le 0 ]; then
              echo "GPG signing key expired: $expiry_date"
              exit 1
            fi
            echo "GPG signing key: usable; expires $expiry_date ($days_remaining days remaining)."
            if [ "$days_remaining" -lt 30 ]; then
              echo "GPG signing key expires in fewer than 30 days; renew it before a release."
              exit 1
            fi
          fi

  gpg-win:
    name: Validate Windows release signing key
    if: inputs.scope == 'all' || inputs.scope == 'gpg' || inputs.scope == 'gpg-windows'
    runs-on: ubuntu-latest
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_WIN }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE_WIN }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID_WIN }}
    steps:
      - name: Check private key, passphrase, and expiry
        shell: bash
        run: |
          set -euo pipefail
          for name in GPG_PRIVATE_KEY GPG_PASSPHRASE GPG_KEY_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name"
              exit 1
            fi
          done

          export GNUPGHOME="$RUNNER_TEMP/release-secret-check-gnupg-win"
          install -d -m 700 "$GNUPGHOME"
          signature="$RUNNER_TEMP/release-secret-check.sig"
          trap 'rm -rf "$GNUPGHOME" "$signature"' EXIT

          if ! printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import >/dev/null 2>&1; then
            echo "GPG_PRIVATE_KEY could not be imported."
            exit 1
          fi
          key_info="$(gpg --batch --with-colons --list-secret-keys "$GPG_KEY_ID" 2>/dev/null)" || {
            echo "GPG_KEY_ID does not match an imported secret key."
            exit 1
          }
          if ! printf '%s\n' "$key_info" | grep -q '^sec:'; then
            echo "GPG_KEY_ID does not identify a private signing key."
            exit 1
          fi

          printf 'ImageMerge release signing validation\n' |
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --local-user "$GPG_KEY_ID" --armor --detach-sign --output "$signature" >/dev/null 2>&1 || {
                echo "GPG key selection or passphrase is invalid."
                exit 1
              }

          expiry="$(printf '%s\n' "$key_info" | awk -F: '($1 == "sec" || $1 == "ssb") && $12 ~ /s/ { if ($7 != "" && $7 != "0") print $7 }' | sort -n | head -n 1)"
          if [ -z "$expiry" ]; then
            echo "GPG signing key (Windows): usable; no expiration date is set."
          else
            now="$(date +%s)"
            days_remaining=$(( (expiry - now) / 86400 ))
            expiry_date="$(date -u -d "@$expiry" '+%Y-%m-%d %H:%M UTC')"
            if [ "$days_remaining" -le 0 ]; then
              echo "GPG signing key (Windows) expired: $expiry_date"
              exit 1
            fi
            echo "GPG signing key (Windows): usable; expires $expiry_date ($days_remaining days remaining)."
            if [ "$days_remaining" -lt 30 ]; then
              echo "GPG signing key (Windows) expires in fewer than 30 days; renew it before a release."
              exit 1
            fi
          fi

  github-tokens:
    name: Validate GitHub publishing tokens
    if: inputs.scope == 'all' || inputs.scope == 'github'
    runs-on: ubuntu-latest
    env:
      WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
      FLATHUB_GITHUB_TOKEN: ${{ secrets.FLATHUB_GITHUB_TOKEN }}
      HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      FLATHUB_TARGET_REPO: ${{ vars.FLATHUB_TARGET_REPO }}
      FLATHUB_BASE_REPO: ${{ vars.FLATHUB_BASE_REPO }}
      HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
      HOMEBREW_TAP_BASE_REPO: ${{ vars.HOMEBREW_TAP_BASE_REPO }}
    steps:
      - name: Verify token access without publishing
        shell: bash
        run: |
          set -uo pipefail
          failed=0

          check_identity() {
            local name="$1"
            local token="$2"
            if [ -z "$token" ]; then
              echo "$name: MISSING"
              failed=1
              return 1
            fi
            local login
            if ! login="$(GH_TOKEN="$token" gh api user --jq .login 2>/dev/null)"; then
              echo "$name: INVALID or revoked (GitHub API authentication failed)"
              failed=1
              return 1
            fi
            echo "$name: valid for GitHub account @$login"
            return 0
          }

          check_write_access() {
            local name="$1"
            local token="$2"
            local repo="$3"
            local permissions
            if ! permissions="$(GH_TOKEN="$token" gh api "repos/$repo" --jq '.permissions.push // false' 2>/dev/null)"; then
              echo "$name: cannot read $repo"
              failed=1
              return
            fi
            if [ "$permissions" != "true" ]; then
              echo "$name: token has no push access to $repo"
              failed=1
              return
            fi
            echo "$name: GitHub account has push-level access to $repo."
            echo "  Confirm the PAT itself grants Contents: read/write for this repository."
          }

          check_read_access() {
            local name="$1"
            local token="$2"
            local repo="$3"
            if ! GH_TOKEN="$token" gh api "repos/$repo" --silent >/dev/null 2>&1; then
              echo "$name: cannot access configured base repository $repo"
              failed=1
            else
              echo "$name: configured base repository $repo is accessible."
            fi
          }

          winget_login=""
          if check_identity WINGET_GITHUB_TOKEN "$WINGET_GITHUB_TOKEN"; then
            winget_login="$(GH_TOKEN="$WINGET_GITHUB_TOKEN" gh api user --jq .login)"
            if GH_TOKEN="$WINGET_GITHUB_TOKEN" gh api "repos/$winget_login/winget-pkgs" --jq '.permissions.push // false' >/dev/null 2>&1; then
              check_write_access WINGET_GITHUB_TOKEN "$WINGET_GITHUB_TOKEN" "$winget_login/winget-pkgs"
            else
              echo "WINGET_GITHUB_TOKEN: no winget-pkgs fork exists yet; the manually started publisher can create it."
            fi
          fi

          if check_identity FLATHUB_GITHUB_TOKEN "$FLATHUB_GITHUB_TOKEN"; then
            flathub_target="${FLATHUB_TARGET_REPO:-${GITHUB_REPOSITORY_OWNER}/flathub}"
            flathub_base="${FLATHUB_BASE_REPO:-flathub/flathub}"
            check_write_access FLATHUB_GITHUB_TOKEN "$FLATHUB_GITHUB_TOKEN" "$flathub_target"
            check_read_access FLATHUB_GITHUB_TOKEN "$FLATHUB_GITHUB_TOKEN" "$flathub_base"
          fi

          if [ -n "$HOMEBREW_TAP_GITHUB_TOKEN" ]; then
            if check_identity HOMEBREW_TAP_GITHUB_TOKEN "$HOMEBREW_TAP_GITHUB_TOKEN"; then
              tap_repo="${HOMEBREW_TAP_REPO:-${GITHUB_REPOSITORY_OWNER}/homebrew-tap}"
              tap_base="${HOMEBREW_TAP_BASE_REPO:-$tap_repo}"
              check_write_access HOMEBREW_TAP_GITHUB_TOKEN "$HOMEBREW_TAP_GITHUB_TOKEN" "$tap_repo"
              check_read_access HOMEBREW_TAP_GITHUB_TOKEN "$HOMEBREW_TAP_GITHUB_TOKEN" "$tap_base"
            fi
          else
            tap_repo="${HOMEBREW_TAP_REPO:-${GITHUB_REPOSITORY_OWNER}/homebrew-tap}"
            if [ "$tap_repo" = "$GITHUB_REPOSITORY" ]; then
              echo "HOMEBREW_TAP_GITHUB_TOKEN: not needed; the manual publisher uses this repository's write-scoped GITHUB_TOKEN."
            else
              echo "HOMEBREW_TAP_GITHUB_TOKEN: MISSING for external tap $tap_repo"
              failed=1
            fi
          fi

          echo "GitHub PAT expiry is not exposed by the API. Confirm expiration dates in Settings > Developer settings > Personal access tokens."
          if [ "$failed" -ne 0 ]; then exit 1; fi

  snap-credentials:
    name: Validate Snap Store credentials
    if: inputs.scope == 'all' || inputs.scope == 'snap'
    runs-on: ubuntu-latest
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - name: Verify Store login without uploading
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "Missing secret: SNAPCRAFT_STORE_CREDENTIALS"
            exit 1
          fi
          if ! command -v snapcraft >/dev/null 2>&1; then
            sudo snap install snapcraft --classic
          fi
          if ! snapcraft whoami >"$RUNNER_TEMP/snapcraft-whoami.log" 2>&1; then
            echo "Snap Store credentials were rejected or are no longer valid."
            exit 1
          fi
          echo "Snap Store credentials: accepted by Snapcraft; no package was uploaded."
          echo "Snap Store credential expiry is not reported by this login check; rotate credentials if revoked or account access changes."