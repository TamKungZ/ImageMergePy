name: Publish to TamKungZ Packages

# Add PACKAGES_DISPATCH_TOKEN as an Actions secret: a fine-grained PAT scoped only
# to TamKungZ/tamkungz-pkgs with Actions: read and write.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub Release tag (for example v2.0.3)
        required: true
        type: string
      overwrite:
        description: Replace a package already published with different content (use only to repair a release)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: packages-${{ github.event.release.tag_name || inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate published release and package assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $tag"
            exit 1
          fi

          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          if [ "$(jq -r '.draft' <<<"$release")" != "false" ]; then
            echo "::error::Release $tag must be published before package distribution."
            exit 1
          fi
          if [ "$(jq -r '.prerelease' <<<"$release")" = "true" ]; then
            echo "::error::Prereleases are not published to TamKungZ Packages."
            exit 1
          fi

          version="${tag#v}"
          deb_legacy="ImageMerge-linux-x64.deb"
          rpm_legacy="ImageMerge-linux-x64.rpm"
          deb_versioned="imagemerge_${version}_amd64.deb"
          rpm_versioned="imagemerge-${version}-1.x86_64.rpm"
          for pair in "$deb_legacy|$deb_versioned" "$rpm_legacy|$rpm_versioned"; do
            legacy="${pair%%|*}"
            versioned="${pair#*|}"
            if ! jq -e --arg legacy "$legacy" --arg versioned "$versioned" \
              '.assets | any(.name == $legacy or .name == $versioned)' <<<"$release" >/dev/null; then
              echo "::error::Release $tag is missing required package asset ($legacy or $versioned)."
              exit 1
            fi
          done

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Validate package dispatch token
        env:
          PACKAGES_DISPATCH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
        shell: bash
        run: |
          if [ -z "$PACKAGES_DISPATCH_TOKEN" ]; then
            echo "::error::Missing secret: PACKAGES_DISPATCH_TOKEN"
            echo "Create a fine-grained token for TamKungZ/tamkungz-pkgs with Actions: read and write."
            exit 1
          fi

      - name: Ask TamKungZ Packages to ingest this release
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
          SOURCE: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          PACKAGES_REPO: TamKungZ/tamkungz-pkgs
          OVERWRITE: ${{ github.event_name == 'workflow_dispatch' && inputs.overwrite || false }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run publish.yml --repo "$PACKAGES_REPO" --ref main \
            -f source="$SOURCE" -f tag="$TAG" -f overwrite="$OVERWRITE"
          echo "Dispatched $SOURCE $TAG to $PACKAGES_REPO."
