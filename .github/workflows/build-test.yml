name: Build Test

on:
  push:
    tags-ignore:
      - "*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pin Linux runner to Ubuntu 22.04 so produced Linux binaries
        # target glibc 2.35 (compatible with Ubuntu 22.04+ users).
        os: [windows-latest, ubuntu-22.04, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test and build Native SDK
        run: |
          cargo test --locked --manifest-path native/imagemerge-sdk/Cargo.toml
          cargo build --locked --release --manifest-path native/imagemerge-sdk/Cargo.toml

      - name: Verify syntax
        run: |
          python -m compileall MainApp.py src scripts
          python -m py_compile scripts/test_native_sdk.py

      - name: Build with Nuitka
        run: python scripts/build_nuitka.py

      - name: Smoke test Native SDK against standalone app
        run: python scripts/test_native_sdk.py

      - name: Smoke test GUI start-up of standalone app
        run: python scripts/smoke_gui.py
