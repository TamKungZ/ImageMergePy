name: Publish Snap

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub Release tag (for example v2.0.0)
        required: true
        type: string
      channel:
        description: Snap Store channel (choose stable only after manual review)
        required: true
        default: beta
        type: choice
        options:
          - edge
          - beta
          - candidate
          - stable

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish-snap:
    name: Upload Snap to Store
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag and channel
        id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ]; then
            echo "Missing release tag"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi

          CHANNEL="$RELEASE_CHANNEL"
          case "$CHANNEL" in
            stable|candidate|beta|edge) ;;
            *)
              echo "Invalid channel: $CHANNEL"
              echo "Allowed values: stable, candidate, beta, edge"
              exit 1
              ;;
          esac

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Validate Snap Store credentials
        shell: bash
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "Missing secret: SNAPCRAFT_STORE_CREDENTIALS"
            echo "Create credentials with: snapcraft export-login ..."
            exit 1
          fi

      - name: Resolve snap asset URL
        id: asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          RELEASE="$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}")"
          if [ "$(printf '%s' "$RELEASE" | jq -r '.draft')" != "false" ]; then
            echo "Release $TAG must be published before Snap submission."
            exit 1
          fi
          if [ "$(printf '%s' "$RELEASE" | jq -r '.prerelease')" = "true" ]; then
            echo "Snap submission is disabled for prereleases."
            exit 1
          fi
          SNAP_URL="$(printf '%s' "$RELEASE" | jq -r '[.assets[] | select(.name | endswith(".snap"))][0].browser_download_url // empty')"
          SNAP_NAME="$(printf '%s' "$RELEASE" | jq -r '[.assets[] | select(.name | endswith(".snap"))][0].name // empty')"

          if [ -z "$SNAP_URL" ] || [ -z "$SNAP_NAME" ] || [ "$SNAP_URL" = "null" ] || [ "$SNAP_NAME" = "null" ]; then
            echo "No .snap release asset found for tag ${TAG}"
            exit 1
          fi

          echo "url=$SNAP_URL" >> "$GITHUB_OUTPUT"
          echo "name=$SNAP_NAME" >> "$GITHUB_OUTPUT"

      - name: Download snap asset
        shell: bash
        run: |
          curl --fail --location --retry 3 "${{ steps.asset.outputs.url }}" -o "${{ steps.asset.outputs.name }}"

      - name: Publish to Snap Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.asset.outputs.name }}
          release: ${{ steps.meta.outputs.channel }}
