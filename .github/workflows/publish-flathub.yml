name: Publish Flathub PR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub Release tag (for example v2.0.0)
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  FLATPAK_APP_ID: me.tamkungz.ImageMerge

jobs:
  flathub-pr:
    name: Create/Update Flathub PR
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ]; then
            echo "Missing release tag"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve Flathub target
        id: target
        shell: bash
        env:
          FLATHUB_TARGET_REPO: ${{ vars.FLATHUB_TARGET_REPO }}
          FLATHUB_BASE_REPO: ${{ vars.FLATHUB_BASE_REPO }}
        run: |
          TARGET_REPO="$FLATHUB_TARGET_REPO"
          if [ -z "$TARGET_REPO" ]; then
            TARGET_REPO="${{ github.repository_owner }}/flathub"
          fi

          BASE_REPO="$FLATHUB_BASE_REPO"
          if [ -z "$BASE_REPO" ]; then
            BASE_REPO="flathub/flathub"
          fi

          TARGET_OWNER="${TARGET_REPO%%/*}"

          echo "target_repo=$TARGET_REPO" >> "$GITHUB_OUTPUT"
          echo "base_repo=$BASE_REPO" >> "$GITHUB_OUTPUT"
          echo "target_owner=$TARGET_OWNER" >> "$GITHUB_OUTPUT"

      - name: Validate Flathub token
        shell: bash
        env:
          FLATHUB_GITHUB_TOKEN: ${{ secrets.FLATHUB_GITHUB_TOKEN }}
        run: |
          if [ -z "$FLATHUB_GITHUB_TOKEN" ]; then
            echo "Missing secret: FLATHUB_GITHUB_TOKEN"
            echo "Required for pushing a branch to the configured Flathub fork and opening the upstream PR."
            exit 1
          fi

      - name: Checkout source repository
        uses: actions/checkout@v5

      - name: Build source URL and checksum
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          SRC_URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"

          RELEASE="$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}")"
          if [ "$(printf '%s' "$RELEASE" | jq -r '.draft')" != "false" ]; then
            echo "Release $TAG must be published before Flathub submission."
            exit 1
          fi
          if [ "$(printf '%s' "$RELEASE" | jq -r '.prerelease')" = "true" ]; then
            echo "Flathub submission is disabled for prereleases."
            exit 1
          fi
          curl --fail --location --retry 3 "$SRC_URL" -o source.tar.gz
          SRC_SHA256="$(sha256sum source.tar.gz | cut -d' ' -f1)"

          echo "url=$SRC_URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SRC_SHA256" >> "$GITHUB_OUTPUT"

      - name: Generate Flathub manifest for release
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          manifest_path = Path('packaging/flathub/me.tamkungz.ImageMerge.yml')
          text = manifest_path.read_text(encoding='utf-8')

          source_url = "${{ steps.source.outputs.url }}"
          source_sha = "${{ steps.source.outputs.sha256 }}"

          archive_pattern = re.compile(
              r'(?m)(^      - type: archive\n        url: )'
              r'https://github\.com/[^ \n]+/archive/refs/tags/[^ \n]+\.tar\.gz'
              r'(\n        sha256: )[0-9a-f]{64}$'
          )
          text, replacements = archive_pattern.subn(
              lambda match: f'{match.group(1)}{source_url}{match.group(2)}{source_sha}',
              text,
          )
          if replacements != 1:
              raise SystemExit(
                  f'Expected exactly one GitHub source archive checksum to update; found {replacements}'
              )

          out_path = Path('me.tamkungz.ImageMerge.yml')
          out_path.write_text(text, encoding='utf-8')
          print(f'Wrote {out_path}')
          PY

      - name: Validate target and base repositories exist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_GITHUB_TOKEN }}
        run: |
          TARGET_REPO="${{ steps.target.outputs.target_repo }}"
          BASE_REPO="${{ steps.target.outputs.base_repo }}"

          gh api "repos/${TARGET_REPO}" >/dev/null
          gh api "repos/${BASE_REPO}" >/dev/null

      - name: Resolve base default branch
        id: basemeta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_GITHUB_TOKEN }}
        run: |
          BASE_REPO="${{ steps.target.outputs.base_repo }}"
          DEFAULT_BRANCH="$(gh api "repos/${BASE_REPO}" --jq '.default_branch')"
          if [ -z "$DEFAULT_BRANCH" ] || [ "$DEFAULT_BRANCH" = "null" ]; then
            echo "Unable to resolve default branch for ${BASE_REPO}"
            exit 1
          fi
          echo "default_branch=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout Flathub fork
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.target.outputs.target_repo }}
          token: ${{ secrets.FLATHUB_GITHUB_TOKEN }}
          ref: ${{ steps.basemeta.outputs.default_branch }}
          path: flathub

      - name: Commit manifest update
        id: commit
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          BRANCH="chore/flathub-${{ env.FLATPAK_APP_ID }}-${VERSION}-${{ github.run_id }}"

          cp me.tamkungz.ImageMerge.yml flathub/me.tamkungz.ImageMerge.yml

          git -C flathub config user.name "github-actions[bot]"
          git -C flathub config user.email "github-actions[bot]@users.noreply.github.com"
          git -C flathub checkout -b "$BRANCH"
          git -C flathub add me.tamkungz.ImageMerge.yml

          if git -C flathub diff --cached --quiet; then
            echo "No Flathub manifest changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git -C flathub commit -m "${{ env.FLATPAK_APP_ID }}: update to ${VERSION}"
          git -C flathub push -u origin "$BRANCH"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create or update Flathub PR
        if: steps.commit.outputs.changed == 'true'
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          BASE_REPO="${{ steps.target.outputs.base_repo }}"
          TARGET_OWNER="${{ steps.target.outputs.target_owner }}"
          BRANCH="${{ steps.commit.outputs.branch }}"
          BASE_BRANCH="${{ steps.basemeta.outputs.default_branch }}"

          if PR_URL="$(gh pr create \
            --repo "$BASE_REPO" \
            --head "${TARGET_OWNER}:${BRANCH}" \
            --base "$BASE_BRANCH" \
            --title "${{ env.FLATPAK_APP_ID }}: update to ${VERSION}" \
            --body "Automated Flathub manifest update for release ${VERSION}.\n\n- App ID: ${{ env.FLATPAK_APP_ID }}\n- Source: ${{ steps.source.outputs.url }}\n- SHA256: ${{ steps.source.outputs.sha256 }}")"; then
            echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Automatic PR creation failed (likely token scope restriction)."
          FALLBACK_URL="https://github.com/${BASE_REPO}/compare/${BASE_BRANCH}...${TARGET_OWNER}:${BRANCH}?expand=1"
          echo "Open this URL to create the PR manually: ${FALLBACK_URL}"
          echo "url=${FALLBACK_URL}" >> "$GITHUB_OUTPUT"

      - name: Print PR URL
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          echo "Flathub PR: ${{ steps.pr.outputs.url }}"
