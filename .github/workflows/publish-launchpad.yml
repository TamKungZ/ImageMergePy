name: Publish to Launchpad Stable PPA

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub Release tag (for example v2.0.3)
        required: true
        type: string
      maintainer_email:
        description: Email registered with Launchpad and the upload signing key
        required: true
        type: string
      revision:
        description: Ubuntu package revision, the trailing N in 2.0.3ubuntu26.04.N (increase only when re-uploading this release)
        required: true
        default: "1"
        type: string
      changelog_note:
        description: Extra line for debian/changelog, if needed (optional)
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  LAUNCHPAD_PPA: ppa:tamkungz/stable

jobs:
  publish:
    name: Upload Ubuntu ${{ matrix.suite }} source
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [jammy, noble, resolute]
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Check out packaging tooling from the workflow commit
        if: inputs.revision != '1'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: tooling

      - name: Use current packaging tooling with the tagged release
        if: inputs.revision != '1'
        shell: bash
        run: |
          set -euo pipefail
          for path in tooling/scripts/build_launchpad_source.py tooling/packaging/launchpad/debian tooling/packaging/launchpad/imagemerge; do
            if [ ! -e "$path" ]; then
              echo "::error::Missing packaging file on the dispatched ref: ${path#tooling/}"
              exit 1
            fi
          done
          mkdir -p scripts packaging
          cp tooling/scripts/build_launchpad_source.py scripts/build_launchpad_source.py
          rm -rf packaging/launchpad
          cp -a tooling/packaging/launchpad packaging/launchpad

      - name: Validate release and suite
        id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PACKAGE_REVISION: ${{ inputs.revision }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Tag must be a stable version tag such as v2.0.0."
            exit 1
          fi
          if [[ ! "$PACKAGE_REVISION" =~ ^[1-9][0-9]{0,2}$ ]]; then
            echo "revision must be a positive integer such as 2."
            exit 1
          fi

          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          if [ "$(printf '%s' "$release" | jq -r '.draft')" != "false" ]; then
            echo "Release $tag must be published before Launchpad upload."
            exit 1
          fi
          if [ "$(printf '%s' "$release" | jq -r '.prerelease')" = "true" ]; then
            echo "Launchpad uploads are disabled for prereleases."
            exit 1
          fi
          asset="$(printf '%s' "$release" | jq -r '.assets[] | select(.name == "ImageMerge-linux-x64.zip") | .name' | head -n 1)"
          if [ "$asset" != "ImageMerge-linux-x64.zip" ]; then
            echo "Release $tag does not contain ImageMerge-linux-x64.zip."
            exit 1
          fi

          version="${tag#v}"
          metadata_version="$(python3 -c 'import json; print(json.load(open("app_metadata.json", encoding="utf-8"))["product_version"].rsplit(".", 1)[0])')"
          if [ "$version" != "$metadata_version" ]; then
            echo "Tag version $version does not match app metadata version $metadata_version."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "revision=$PACKAGE_REVISION" >> "$GITHUB_OUTPUT"

      - name: Validate Launchpad signing key
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_LINUX }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE_LINUX }}
        run: |
          set -euo pipefail
          for name in GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name"
              exit 1
            fi
          done

          export GNUPGHOME="$RUNNER_TEMP/launchpad-gnupg"
          install -d -m 700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          if ! printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import >/dev/null 2>&1; then
            echo "GPG_PRIVATE_KEY could not be imported."
            exit 1
          fi
          if ! gpg --batch --with-colons --list-secret-keys | grep -q '^sec:'; then
            echo "GPG_PRIVATE_KEY does not contain an imported private key."
            exit 1
          fi

      - name: Download published Linux standalone runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/imagemerge-release"
          gh release download "${{ steps.meta.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "ImageMerge-linux-x64.zip" \
            --dir "$RUNNER_TEMP/imagemerge-release"

      - name: Install Debian source upload tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts dput

      - name: Build and upload signed source package
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_LINUX }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE_LINUX }}
          MAINTAINER_EMAIL: ${{ inputs.maintainer_email }}
          CHANGELOG_NOTE: ${{ inputs.changelog_note }}
        run: |
          set -euo pipefail
          if [[ ! "$MAINTAINER_EMAIL" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]; then
            echo "maintainer_email must be a valid email address registered with Launchpad."
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/launchpad-upload-gnupg"
          install -d -m 700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import >/dev/null 2>&1
          GPG_KEY_ID="$(gpg --batch --with-colons --list-secret-keys 2>/dev/null | awk -F: '$1=="sec"{f=1;next} f && $1=="fpr"{print $10; exit}')"
          if [ -z "$GPG_KEY_ID" ]; then
            echo "Could not determine the key ID from GPG_PRIVATE_LINUX."
            exit 1
          fi

          # Launchpad only accepts uploads signed by a key registered to the uploader's account.
          maint_lc="$(printf '%s' "$MAINTAINER_EMAIL" | tr '[:upper:]' '[:lower:]')"
          if ! gpg --batch --with-colons --list-secret-keys "$GPG_KEY_ID" 2>/dev/null \
               | awk -F: '$1=="uid"{print tolower($10)}' | grep -qF "<${maint_lc}>"; then
            echo "::warning::The signing key has no user ID with <$MAINTAINER_EMAIL>. Launchpad may reject the upload if the key/email is not registered on your account."
          fi

          signing_command="$RUNNER_TEMP/gpg-launchpad-sign"
          cat > "$signing_command" <<'EOF'
          #!/bin/sh
          set -eu
          printf '%s' "$GPG_PASSPHRASE" | exec gpg --batch --yes \
            --pinentry-mode loopback --passphrase-fd 0 "$@"
          EOF
          chmod 0700 "$signing_command"

          # Revision 1 runs the tag's own script exactly as released (older scripts have no --revision).
          extra_args=()
          if [ "${{ steps.meta.outputs.revision }}" != "1" ]; then
            extra_args+=(--revision "${{ steps.meta.outputs.revision }}" --changelog-note "$CHANGELOG_NOTE")
          fi

          mkdir -p "$RUNNER_TEMP/launchpad-source"
          python3 scripts/build_launchpad_source.py \
            --archive "$RUNNER_TEMP/imagemerge-release/ImageMerge-linux-x64.zip" \
            --tag "${{ steps.meta.outputs.tag }}" \
            --suite "${{ matrix.suite }}" \
            --output-dir "$RUNNER_TEMP/launchpad-source" \
            --signing-key "$GPG_KEY_ID" \
            --signing-command "$signing_command" \
            --maintainer-email "$MAINTAINER_EMAIL" \
            "${extra_args[@]}"

          # Refuse to upload a package that would not start on a clean system.
          source_tarball="$(find "$RUNNER_TEMP/launchpad-source" -maxdepth 1 -name '*.tar.xz' -print -quit)"
          if [ -z "$source_tarball" ]; then
            echo "Source tarball was not produced."
            exit 1
          fi
          control="$(tar -xJOf "$source_tarball" --wildcards '*/debian/control')"
          for lib in libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0 libxcb-cursor0; do
            if ! printf '%s' "$control" | grep -q "$lib"; then
              echo "::error::debian/control does not depend on $lib. This tag's packaging is incomplete; upload revision 2 or higher from a fixed commit instead."
              exit 1
            fi
          done
          grep -h '^Version:' "$RUNNER_TEMP"/launchpad-source/*.dsc

          # Upload the signed source package to Launchpad.
          # This must happen in the same step so GNUPGHOME is still available for dput's signature verification.
          changes_file="$(find "$RUNNER_TEMP/launchpad-source" -maxdepth 1 -name '*_source.changes' -print -quit)"
          if [ -z "$changes_file" ]; then
            echo "Signed Launchpad source .changes file was not produced."
            exit 1
          fi
          dput "$LAUNCHPAD_PPA" "$changes_file"