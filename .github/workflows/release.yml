name: Release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v2.0.0)
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Validate tag, application version, and release state
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be a version tag such as v2.0.0."
            exit 1
          fi
          version="${tag#v}"
          metadata_version="$(python -c 'import json; print(json.load(open("app_metadata.json", encoding="utf-8"))["product_version"])')"
          metadata_version="${metadata_version%.*}"
          if [ "$metadata_version" != "${version%%[-+]*}" ]; then
            echo "Tag version $version does not match app_metadata.json version $metadata_version."
            exit 1
          fi
          sdk_version="$(python -c 'import tomllib; print(tomllib.load(open("native/imagemerge-sdk/Cargo.toml", "rb"))["package"]["version"])')"
          if [ "$sdk_version" != "${version%%[-+]*}" ]; then
            echo "Tag version $version does not match Native SDK version $sdk_version."
            exit 1
          fi

          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>release_lookup_error)" && release_found=true || release_found=false
          if [ "$release_found" = true ]; then
            if [ "$(printf '%s' "$release_json" | jq -r '.draft')" != "true" ]; then
              echo "A published GitHub Release already exists for $tag; refusing to overwrite it."
              exit 1
            fi
            echo "Rebuilding assets for existing draft release $tag."
          else
            if ! grep -qi "HTTP 404" release_lookup_error; then
              cat release_lookup_error >&2
              exit 1
            fi
            echo "No release exists for $tag; the workflow will create a draft release."
          fi
          rm -f release_lookup_error
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Pin Linux runner to Ubuntu 22.04 so AppImage/.deb/.rpm are built
        # against glibc 2.35 instead of newer glibc from ubuntu-latest.
        os: [windows-latest, ubuntu-22.04, macos-15-intel, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test and build Native SDK
        run: |
          cargo test --locked --manifest-path native/imagemerge-sdk/Cargo.toml
          cargo build --locked --release --manifest-path native/imagemerge-sdk/Cargo.toml

      - name: Build with Nuitka
        run: python scripts/build_nuitka.py

      - name: Smoke test Native SDK against standalone app
        run: python scripts/test_native_sdk.py

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rpm flatpak flatpak-builder squashfs-tools appstream appstream-compose snapd
          if ! command -v snapcraft >/dev/null 2>&1; then
            sudo snap install snapcraft --classic
          fi
          sudo systemctl start snapd.socket snapd.service >/dev/null 2>&1 || true
          sudo snap wait system seed.loaded >/dev/null 2>&1 || true

          if ! snap list core22 >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              if sudo snap install core22 --channel=latest/stable; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to install required snap base 'core22' after retries"
                exit 1
              fi
              echo "Retrying core22 installation ($attempt/3)..."
              sudo systemctl restart snapd.service >/dev/null 2>&1 || true
              sleep $((attempt * 10))
            done
          fi

          sudo gem install --no-document fpm
          curl -L -o appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool

      - name: Build Linux installers (.deb/.rpm/.AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python - <<'PY'
          import os
          import shutil
          import stat
          import subprocess
          from pathlib import Path

          root = Path('.')
          out = root / 'release_assets'
          out.mkdir(parents=True, exist_ok=True)

          def first_existing(candidates):
              for candidate in candidates:
                  if candidate.exists():
                      return candidate
              return None

          dist_dir = first_existing([
              root / 'dist' / 'linux' / 'MainApp.dist',
              root / 'dist' / 'linux' / 'ImageMerge.dist',
          ])
          if dist_dir is None:
              raise FileNotFoundError('Missing Linux dist folder (MainApp.dist/ImageMerge.dist)')

          main_binary = dist_dir / 'ImageMerge'
          if not main_binary.exists():
              raise FileNotFoundError(f'Missing Linux main binary: {main_binary}')

          tag = os.environ['RELEASE_TAG']
          version = tag[1:] if tag.startswith('v') else tag
          if not version:
              version = '0.0.0'

          pkg_root = root / 'pkgroot'
          if pkg_root.exists():
              shutil.rmtree(pkg_root)
          (pkg_root / 'opt' / 'ImageMerge').mkdir(parents=True, exist_ok=True)
          shutil.copytree(dist_dir, pkg_root / 'opt' / 'ImageMerge', dirs_exist_ok=True)

          bin_dir = pkg_root / 'usr' / 'bin'
          bin_dir.mkdir(parents=True, exist_ok=True)
          launcher = bin_dir / 'imagemerge'
          launcher.write_text('#!/usr/bin/env bash\nexec /opt/ImageMerge/ImageMerge "$@"\n', encoding='utf-8')
          launcher.chmod(launcher.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)

          appdir = root / 'ImageMerge.AppDir'
          if appdir.exists():
              shutil.rmtree(appdir)
          (appdir / 'usr' / 'lib' / 'ImageMerge').mkdir(parents=True, exist_ok=True)
          shutil.copytree(dist_dir, appdir / 'usr' / 'lib' / 'ImageMerge', dirs_exist_ok=True)
          (appdir / 'usr' / 'share' / 'applications').mkdir(parents=True, exist_ok=True)

          app_lib_dir = appdir / 'usr' / 'lib' / 'ImageMerge'

          def resolve_system_library(soname: str) -> Path | None:
              try:
                  output = subprocess.check_output(['ldconfig', '-p'], text=True)
              except Exception:
                  return None
              for line in output.splitlines():
                  line = line.strip()
                  if not line or '=>' not in line:
                      continue
                  if line.startswith(f'{soname} '):
                      return Path(line.rsplit('=>', 1)[1].strip())
              return None

          appimage_runtime_libs = [
              'libxcb-cursor.so.0',
              'libxkbcommon-x11.so.0',
              'libxcb-icccm.so.4',
              'libxcb-keysyms.so.1',
              'libxcb-randr.so.0',
              'libxcb-shape.so.0',
              'libxcb-xfixes.so.0',
              'libxcb-xinerama.so.0',
              'libxcb-render-util.so.0',
              'libxcb-image.so.0',
              'libX11-xcb.so.1',
              'libxkbcommon.so.0',
          ]

          copied_runtime_libs = []
          for soname in appimage_runtime_libs:
              lib_path = resolve_system_library(soname)
              if lib_path is None or not lib_path.exists():
                  print(f'Warning: system library not found for AppImage bundling: {soname}')
                  continue
              target_path = app_lib_dir / lib_path.name
              shutil.copy2(lib_path, target_path)
              copied_runtime_libs.append(target_path.name)

          if copied_runtime_libs:
              print('Bundled AppImage runtime libraries:', ', '.join(sorted(copied_runtime_libs)))

          apprun = appdir / 'AppRun'
          apprun.write_text(
              '#!/usr/bin/env bash\n'
              'HERE="$(dirname "$(readlink -f "$0")")"\n'
              'export LD_LIBRARY_PATH="$HERE/usr/lib/ImageMerge:${LD_LIBRARY_PATH:-}"\n'
              'exec "$HERE/usr/lib/ImageMerge/ImageMerge" "$@"\n',
              encoding='utf-8',
          )
          apprun.chmod(apprun.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)

          desktop_file = appdir / 'ImageMerge.desktop'
          desktop_file.write_text(
              '[Desktop Entry]\n'
              'Type=Application\n'
              'Name=ImageMerge\n'
              'Exec=ImageMerge\n'
              'Icon=ImageMerge\n'
              'Categories=Utility;Graphics;\n',
              encoding='utf-8',
          )

          icon_source = root / 'assets' / 'icons' / 'app-icon-1024.png'
          if not icon_source.is_file():
              raise FileNotFoundError(f'Missing application icon: {icon_source}')
          icon_png = icon_source.read_bytes()
          (appdir / 'ImageMerge.png').write_bytes(icon_png)
          (appdir / '.DirIcon').write_bytes(icon_png)

          print('Prepared Linux packaging trees')
          PY

          VERSION="${RELEASE_TAG#v}"

          ARCH_RAW="$(uname -m)"
          case "$ARCH_RAW" in
            x86_64|amd64)
              ARCH_LABEL="x64"
              DEB_ARCH="amd64"
              RPM_ARCH="x86_64"
              ;;
            aarch64|arm64)
              ARCH_LABEL="arm64"
              DEB_ARCH="arm64"
              RPM_ARCH="aarch64"
              ;;
            armv7l|armv6l|arm)
              ARCH_LABEL="arm"
              DEB_ARCH="armhf"
              RPM_ARCH="armhfp"
              ;;
            i386|i686|x86)
              ARCH_LABEL="x86"
              DEB_ARCH="i386"
              RPM_ARCH="i386"
              ;;
            *)
              ARCH_LABEL="x64"
              DEB_ARCH="amd64"
              RPM_ARCH="x86_64"
              ;;
          esac

          DEB_DEPENDS=(
            "libxcb-cursor0"
            "libxkbcommon-x11-0"
            "libxcb-icccm4"
            "libxcb-keysyms1"
            "libxcb-randr0"
            "libxcb-shape0"
            "libxcb-xfixes0"
            "libxcb-xinerama0"
            "libx11-xcb1"
            "libxcb-render-util0"
            "libxcb-image0"
            "libegl1"
            "libgl1"
          )
          DEB_DEP_ARGS=()
          for dep in "${DEB_DEPENDS[@]}"; do
            DEB_DEP_ARGS+=(--depends "$dep")
          done

          fpm -s dir -t deb -n imagemerge -v "$VERSION" --iteration 1 --architecture "$DEB_ARCH" --license MIT --maintainer "TamKungZ_" --description "Open-source image and video merge tool" --url "https://github.com/${GITHUB_REPOSITORY}" "${DEB_DEP_ARGS[@]}" -C pkgroot .
          mv imagemerge_*_"$DEB_ARCH".deb release_assets/ImageMerge-linux-"$ARCH_LABEL".deb

          RPM_DEPENDS=(
            "libxcb-cursor"
            "libxkbcommon-x11"
            "xcb-util-wm"
            "xcb-util-keysyms"
            "xcb-util-renderutil"
            "xcb-util-image"
            "libX11-xcb"
            "libEGL"
            "libGL"
          )
          RPM_DEP_ARGS=()
          for dep in "${RPM_DEPENDS[@]}"; do
            RPM_DEP_ARGS+=(--depends "$dep")
          done

          fpm -s dir -t rpm -n imagemerge -v "$VERSION" --iteration 1 --architecture "$RPM_ARCH" --license MIT --maintainer "TamKungZ_" --description "Open-source image and video merge tool" --url "https://github.com/${GITHUB_REPOSITORY}" "${RPM_DEP_ARGS[@]}" -C pkgroot .
          mv imagemerge-*.$RPM_ARCH.rpm release_assets/ImageMerge-linux-"$ARCH_LABEL".rpm

          APPIMAGE_ARCH="$ARCH_RAW"
          if [ "$ARCH_RAW" = "amd64" ]; then APPIMAGE_ARCH="x86_64"; fi
          if [ "$ARCH_RAW" = "arm64" ]; then APPIMAGE_ARCH="aarch64"; fi
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH="$APPIMAGE_ARCH" ./appimagetool ImageMerge.AppDir release_assets/ImageMerge-linux-"$ARCH_LABEL".AppImage

      - name: Build Linux Flatpak bundle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"

          DIST_DIR=""
          for candidate in "dist/linux/MainApp.dist" "dist/linux/ImageMerge.dist"; do
            if [ -d "$candidate" ]; then DIST_DIR="$candidate"; break; fi
          done
          if [ -z "$DIST_DIR" ]; then
            echo "Missing Linux dist folder (MainApp.dist/ImageMerge.dist)"
            exit 1
          fi

          ARCH_RAW="$(uname -m)"
          case "$ARCH_RAW" in
            x86_64|amd64) ARCH_LABEL="x64" ;;
            aarch64|arm64) ARCH_LABEL="arm64" ;;
            armv7l|armv6l|arm) ARCH_LABEL="arm" ;;
            i386|i686|x86) ARCH_LABEL="x86" ;;
            *) ARCH_LABEL="x64" ;;
          esac

          rm -rf packaging/flatpak/flatpak-src flatpak-build-dir flatpak-repo
          mkdir -p packaging/flatpak/flatpak-src flatpak-repo release_assets
          cp -a "$DIST_DIR"/. packaging/flatpak/flatpak-src/

          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08

          if ! command -v appstream-compose >/dev/null 2>&1; then
            if command -v appstreamcli >/dev/null 2>&1; then
              mkdir -p .ci-bin
              printf '%s\n' '#!/usr/bin/env bash' 'exec appstreamcli compose "$@"' > .ci-bin/appstream-compose
              chmod +x .ci-bin/appstream-compose
              export PATH="$PWD/.ci-bin:$PATH"
            fi
          fi

          FLATPAK_BRANCH="stable"
          flatpak-builder --force-clean --default-branch="$FLATPAK_BRANCH" --repo=flatpak-repo flatpak-build-dir packaging/flatpak/me.tamkungz.ImageMerge.yml
          flatpak build-bundle flatpak-repo "release_assets/ImageMerge-linux-${ARCH_LABEL}.flatpak" me.tamkungz.ImageMerge "$FLATPAK_BRANCH"

      - name: Build Linux Snap package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"

          DIST_DIR=""
          for candidate in "dist/linux/MainApp.dist" "dist/linux/ImageMerge.dist"; do
            if [ -d "$candidate" ]; then DIST_DIR="$candidate"; break; fi
          done
          if [ -z "$DIST_DIR" ]; then
            echo "Missing Linux dist folder (MainApp.dist/ImageMerge.dist)"
            exit 1
          fi

          ARCH_RAW="$(uname -m)"
          case "$ARCH_RAW" in
            x86_64|amd64) ARCH_LABEL="x64" ;;
            aarch64|arm64) ARCH_LABEL="arm64" ;;
            armv7l|armv6l|arm) ARCH_LABEL="arm" ;;
            i386|i686|x86) ARCH_LABEL="x86" ;;
            *) ARCH_LABEL="x64" ;;
          esac

          rm -rf snap-src
          mkdir -p snap-src release_assets
          cp -a "$DIST_DIR"/. snap-src/

          rm -f ./*.snap
          export SNAPCRAFT_PROJECT_VERSION="$VERSION"

          SNAP_BUILD_OK=0
          for attempt in 1 2 3; do
            if snapcraft pack --destructive-mode; then
              SNAP_BUILD_OK=1
              break
            fi

            echo "snapcraft pack failed (attempt ${attempt}/3), retrying..."
            sudo snap install core22 --channel=latest/stable >/dev/null 2>&1 || true
            sudo systemctl restart snapd.service >/dev/null 2>&1 || true
            sleep $((attempt * 12))
          done

          if [ "$SNAP_BUILD_OK" -ne 1 ]; then
            echo "Snap build failed after retries"
            exit 1
          fi

          SNAP_FILE=""
          for f in ./*.snap; do
            if [ -f "$f" ]; then SNAP_FILE="$f"; break; fi
          done
          if [ -z "$SNAP_FILE" ]; then
            echo "Snap build did not produce a .snap file"
            exit 1
          fi

          mv "$SNAP_FILE" "release_assets/ImageMerge-linux-${ARCH_LABEL}.snap"

      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install wixtoolset --no-progress -y

      - name: Build Windows installer (.msi)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          $distCandidates = @(
            "dist/windows/MainApp.dist",
            "dist/windows/ImageMerge.dist"
          )
          $distDir = $null
          foreach ($candidate in $distCandidates) {
            if (Test-Path $candidate) { $distDir = $candidate; break }
          }
          if (-not $distDir) { throw "Missing Windows dist folder (MainApp.dist/ImageMerge.dist)" }

          if ([string]::IsNullOrWhiteSpace($env:MSIX_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:MSIX_PFX_PASSWORD)) {
            throw "Missing signing secrets: MSIX_PFX_BASE64 / MSIX_PFX_PASSWORD"
          }

          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signtool) {
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $signtool) { throw "signtool.exe not found" }

          $pfxPath = "msix-signing.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:MSIX_PFX_BASE64))

          function Sign-ReleaseFile {
            param([string]$Path)

            if (-not (Test-Path $Path)) { throw "File for signing not found: $Path" }
            & $signtool sign /fd SHA256 /f $pfxPath /p $env:MSIX_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $Path
            if ($LASTEXITCODE -ne 0) { throw "signtool failed: $Path" }
          }

          if (-not (Test-Path "app_metadata.json")) { throw "Missing app_metadata.json" }
          $meta = Get-Content "app_metadata.json" -Raw | ConvertFrom-Json
          $msixIdentityName = [string]$meta.msix_identity_name
          $msixPublisher = [string]$meta.msix_publisher
          $msixPublisherDisplayName = [string]$meta.msix_publisher_display_name
          if ([string]::IsNullOrWhiteSpace($msixIdentityName) -or
              [string]::IsNullOrWhiteSpace($msixPublisher) -or
              [string]::IsNullOrWhiteSpace($msixPublisherDisplayName)) {
            throw "Missing MSIX identity metadata in app_metadata.json"
          }
          $productVersionRaw = [string]$meta.product_version
          if ([string]::IsNullOrWhiteSpace($productVersionRaw)) { $productVersionRaw = "2.0.0.0" }

          $versionParts = $productVersionRaw.Split('.')
          while ($versionParts.Count -lt 3) { $versionParts += "0" }
          $msiVersion = "$($versionParts[0]).$($versionParts[1]).$($versionParts[2])"

          $iconPath = (Resolve-Path "assets/icons/app-icon.ico").Path

          $archRaw = ($env:PROCESSOR_ARCHITECTURE + "").ToLowerInvariant()
          $archLabel = switch ($archRaw) {
            "amd64" { "x64" }
            "x86" { "x86" }
            "arm64" { "arm64" }
            "arm" { "arm" }
            default { "x64" }
          }
          $programFilesDirId = if ($archLabel -eq "x86") { "ProgramFilesFolder" } else { "ProgramFiles64Folder" }

          $mainExePath = Join-Path $distDir "ImageMerge.exe"
          Sign-ReleaseFile -Path $mainExePath

          New-Item -ItemType Directory -Force -Path installer | Out-Null
          New-Item -ItemType Directory -Force -Path release_assets | Out-Null

          heat dir "$distDir" -cg ImageMergeFiles -dr INSTALLFOLDER -scom -sreg -srd -gg -var var.SourceDir -out installer\ImageMergeFiles.wxs

          function Write-WixDefinition {
            param(
              [string]$WxsPath,
              [string]$ProductName,
              [string]$UpgradeCode,
              [string]$RegistryName,
              [switch]$AddCommandPath
            )

            $commandPathFeatureRef = if ($AddCommandPath) {
              '      <ComponentGroupRef Id="ImageMergeCommandPath" />'
            } else {
              ''
            }

            $wxs = @(
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">',
              ('  <Product Id="*" Name="{0}" Language="1033" Version="{1}" Manufacturer="TamKungZ_" UpgradeCode="{2}">' -f $ProductName, $msiVersion, $UpgradeCode),
              '    <Package InstallerVersion="500" Compressed="yes" InstallScope="perMachine" />',
              '    <MajorUpgrade DowngradeErrorMessage="A newer version of [ProductName] is already installed." />',
              '    <MediaTemplate EmbedCab="yes" />',
              '    <Property Id="ARPCONTACT" Value="TamKungZ_" />',
              '    <Property Id="ARPURLINFOABOUT" Value="https://github.com" />',
              '    <Property Id="ARPHELPLINK" Value="https://github.com" />',
              ('    <Icon Id="AppIcon.ico" SourceFile="{0}" />' -f $iconPath),
              '    <Property Id="ARPPRODUCTICON" Value="AppIcon.ico" />',
              '    <Property Id="WIXUI_INSTALLDIR" Value="INSTALLFOLDER" />',
              '    <UIRef Id="WixUI_InstallDir" />',
              ('    <Feature Id="MainFeature" Title="{0}" Level="1">' -f $ProductName),
              '      <ComponentGroupRef Id="ImageMergeFiles" />',
              '      <ComponentGroupRef Id="ImageMergeShortcuts" />',
              $commandPathFeatureRef,
              '    </Feature>',
              '  </Product>',
              '',
              '  <Fragment>',
              '    <Directory Id="TARGETDIR" Name="SourceDir">',
              ('      <Directory Id="{0}">' -f $programFilesDirId),
              ('        <Directory Id="INSTALLFOLDER" Name="{0}" />' -f $ProductName),
              '      </Directory>',
              '      <Directory Id="ProgramMenuFolder">',
              ('        <Directory Id="ImageMergeProgramMenuFolder" Name="{0}" />' -f $ProductName),
              '      </Directory>',
              '      <Directory Id="DesktopFolder" />',
              '    </Directory>',
              '  </Fragment>',
              '',
              '  <Fragment>',
              '    <ComponentGroup Id="ImageMergeShortcuts">',
              '      <Component Id="StartMenuShortcutComponent" Directory="ImageMergeProgramMenuFolder" Guid="*">',
              ('        <Shortcut Id="StartMenuShortcut" Name="{0}" Description="{0}" Target="[INSTALLFOLDER]ImageMerge.exe" WorkingDirectory="INSTALLFOLDER" />' -f $ProductName),
              '        <RemoveFolder Id="RemoveImageMergeProgramMenuFolder" On="uninstall" />',
              ('        <RegistryValue Root="HKCU" Key="Software\TamKungZ_\{0}" Name="StartMenuShortcut" Type="integer" Value="1" KeyPath="yes" />' -f $RegistryName),
              '      </Component>',
              '      <Component Id="DesktopShortcutComponent" Directory="DesktopFolder" Guid="*">',
              ('        <Shortcut Id="DesktopShortcut" Name="{0}" Description="{0}" Target="[INSTALLFOLDER]ImageMerge.exe" WorkingDirectory="INSTALLFOLDER" />' -f $ProductName),
              ('        <RegistryValue Root="HKCU" Key="Software\TamKungZ_\{0}" Name="DesktopShortcut" Type="integer" Value="1" KeyPath="yes" />' -f $RegistryName),
              '      </Component>',
              '    </ComponentGroup>',
              '  </Fragment>',
              '',
              '  <Fragment>',
              '    <ComponentGroup Id="ImageMergeCommandPath">',
              '      <Component Id="CommandPathComponent" Directory="INSTALLFOLDER" Guid="*">',
              '        <Environment Id="ImageMergePathEnvironment" Name="PATH" Value="[INSTALLFOLDER]" Permanent="no" Part="last" Action="append" System="yes" />',
              ('        <RegistryValue Root="HKLM" Key="Software\TamKungZ_\{0}" Name="CommandPath" Type="integer" Value="1" KeyPath="yes" />' -f $RegistryName),
              '      </Component>',
              '    </ComponentGroup>',
              '  </Fragment>',
              '',
              '</Wix>'
            ) -join "`n"

            Set-Content -Path $WxsPath -Value $wxs -Encoding UTF8
          }

          $standardWxsPath = "installer\ImageMerge.wxs"
          $msStoreWxsPath = "installer\ImageMergeGUI.wxs"

          Write-WixDefinition -WxsPath $standardWxsPath -ProductName "ImageMerge" -UpgradeCode "C5A07E9D-9634-44F0-8D8E-050A2F31A8E9" -RegistryName "ImageMerge" -AddCommandPath
          Write-WixDefinition -WxsPath $msStoreWxsPath -ProductName "ImageMergeGUI" -UpgradeCode "A7E84311-245A-4287-B710-95A783D047A8" -RegistryName "ImageMergeGUI"

          $wixArch = if ($archLabel -eq "x86") { "x86" } else { "x64" }

          $standardMsiOutput = "release_assets\ImageMerge-windows-$archLabel.msi"
          $msStoreMsiOutput = "release_assets\ImageMergeGUI-windows-$archLabel-msstore.msi"

          candle -dSourceDir="$distDir" installer\ImageMergeFiles.wxs -arch $wixArch
          candle -dSourceDir="$distDir" $standardWxsPath -arch $wixArch
          light -spdb -ext WixUIExtension ImageMerge.wixobj ImageMergeFiles.wixobj -o $standardMsiOutput
          Sign-ReleaseFile -Path $standardMsiOutput

          candle -dSourceDir="$distDir" $msStoreWxsPath -arch $wixArch
          light -spdb -ext WixUIExtension ImageMergeGUI.wixobj ImageMergeFiles.wixobj -o $msStoreMsiOutput
          Sign-ReleaseFile -Path $msStoreMsiOutput

          $iconSource = "assets/icons/app-icon-1024.png"
          if (-not (Test-Path $iconSource)) { throw "Missing icon source for MSIX: $iconSource" }

          $msixRoot = "msix_root"
          if (Test-Path $msixRoot) { Remove-Item $msixRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $msixRoot | Out-Null

          Copy-Item -Path (Join-Path $distDir "*") -Destination $msixRoot -Recurse -Force

          $assetsDir = Join-Path $msixRoot "Assets"
          New-Item -ItemType Directory -Force -Path $assetsDir | Out-Null

          Add-Type -AssemblyName System.Drawing
          function Write-ResizedPng {
            param(
              [string]$InputPath,
              [string]$OutputPath,
              [int]$Width,
              [int]$Height
            )

            $img = [System.Drawing.Image]::FromFile($InputPath)
            $bmp = New-Object System.Drawing.Bitmap($Width, $Height)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
            $g.PixelOffsetMode = [System.Drawing.Drawing2D.PixelOffsetMode]::HighQuality
            $g.CompositingQuality = [System.Drawing.Drawing2D.CompositingQuality]::HighQuality
            $g.Clear([System.Drawing.Color]::Transparent)
            $g.DrawImage($img, 0, 0, $Width, $Height)
            $bmp.Save($OutputPath, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose(); $img.Dispose()
          }

          Write-ResizedPng -InputPath $iconSource -OutputPath (Join-Path $assetsDir "Square44x44Logo.png") -Width 44 -Height 44
          Write-ResizedPng -InputPath $iconSource -OutputPath (Join-Path $assetsDir "Square150x150Logo.png") -Width 150 -Height 150
          Write-ResizedPng -InputPath $iconSource -OutputPath (Join-Path $assetsDir "Square310x310Logo.png") -Width 310 -Height 310
          Write-ResizedPng -InputPath $iconSource -OutputPath (Join-Path $assetsDir "StoreLogo.png") -Width 50 -Height 50

          $versionParts4 = $productVersionRaw.Split('.')
          while ($versionParts4.Count -lt 4) { $versionParts4 += "0" }
          $msixVersion = "$($versionParts4[0]).$($versionParts4[1]).$($versionParts4[2]).$($versionParts4[3])"

          $msixArch = switch ($archLabel) {
            "x86" { "x86" }
            "arm64" { "arm64" }
            default { "x64" }
          }

          $manifest = @(
            '<?xml version="1.0" encoding="utf-8"?>',
            '<Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10" xmlns:desktop="http://schemas.microsoft.com/appx/manifest/desktop/windows10" xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities" IgnorableNamespaces="uap desktop rescap">',
            ('  <Identity Name="{0}" Publisher="{1}" Version="{2}" ProcessorArchitecture="{3}" />' -f $msixIdentityName, $msixPublisher, $msixVersion, $msixArch),
            ('  <Properties><DisplayName>ImageMergeGUI</DisplayName><PublisherDisplayName>{0}</PublisherDisplayName><Description>Open-source image and video merge tool</Description><Logo>Assets/StoreLogo.png</Logo></Properties>' -f $msixPublisherDisplayName),
            '  <Dependencies><TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.26100.0" /></Dependencies>',
            '  <Resources><Resource Language="en-us" /></Resources>',
            '  <Applications>',
            '    <Application Id="App" Executable="ImageMerge.exe" EntryPoint="Windows.FullTrustApplication">',
            '      <uap:VisualElements DisplayName="ImageMergeGUI" Description="Open-source image and video merge tool" BackgroundColor="transparent" Square44x44Logo="Assets/Square44x44Logo.png" Square150x150Logo="Assets/Square150x150Logo.png">',
            '        <uap:DefaultTile Wide310x150Logo="Assets/Square150x150Logo.png" Square310x310Logo="Assets/Square310x310Logo.png" />',
            '      </uap:VisualElements>',
            '      <Extensions><desktop:Extension Category="windows.fullTrustProcess" Executable="ImageMerge.exe" /></Extensions>',
            '    </Application>',
            '  </Applications>',
            '  <Capabilities><rescap:Capability Name="runFullTrust" /></Capabilities>',
            '</Package>'
          ) -join "`n"

          Set-Content -Path (Join-Path $msixRoot "AppxManifest.xml") -Value $manifest -Encoding UTF8

          $makeappx = (Get-Command makeappx.exe -ErrorAction SilentlyContinue).Source
          if (-not $makeappx) {
            $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter makeappx.exe -Recurse -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $makeappx) { throw "makeappx.exe not found" }

          $msixOutput = "release_assets\ImageMergeGUI-windows-$archLabel.msix"
          & $makeappx pack /d $msixRoot /p $msixOutput /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }

          Sign-ReleaseFile -Path $msixOutput

          Remove-Item $pfxPath -Force

          if (Test-Path "cab1.cab") { Remove-Item "cab1.cab" -Force }
          Get-ChildItem -Path . -Filter "*.wixpdb" -ErrorAction SilentlyContinue | Remove-Item -Force

      - name: Pack release archives
        shell: bash
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          root = Path('.')
          out = root / 'release_assets'
          out.mkdir(parents=True, exist_ok=True)
          runner = os.environ.get('RUNNER_OS', '')

          def normalize_arch(value: str) -> str:
              arch = (value or '').strip().lower()
              aliases = {
                  'amd64': 'x64',
                  'x86_64': 'x64',
                  'x64': 'x64',
                  'i386': 'x86',
                  'i686': 'x86',
                  'x86': 'x86',
                  'aarch64': 'arm64',
                  'arm64': 'arm64',
                  'armv7l': 'arm',
                  'armv6l': 'arm',
                  'arm': 'arm',
              }
              return aliases.get(arch, 'x64')

          def zip_dir(name: str, source_dir: Path, top_level: str = 'ImageMerge'):
              if not source_dir.exists():
                  raise FileNotFoundError(f'Missing build output: {source_dir}')
              staging_root = root / 'zip_staging' / name
              if staging_root.exists():
                  shutil.rmtree(staging_root)
              payload_root = staging_root / top_level
              payload_root.parent.mkdir(parents=True, exist_ok=True)
              if source_dir.is_dir():
                  shutil.copytree(source_dir, payload_root, dirs_exist_ok=True)
              else:
                  raise FileNotFoundError(f'Unsupported build output type: {source_dir}')
              shutil.make_archive(str(out / name), 'zip', root_dir=staging_root, base_dir=top_level)
              shutil.rmtree(staging_root, ignore_errors=True)

          def zip_native_sdk(os_name: str, arch: str, library_name: str, runtime_dir: Path):
              sdk_root = root / 'native' / 'imagemerge-sdk'
              release_dir = sdk_root / 'target' / 'release'
              library = release_dir / library_name
              if not library.is_file():
                  raise FileNotFoundError(f'Missing Native SDK library: {library}')
              if not runtime_dir.is_dir():
                  raise FileNotFoundError(f'Missing ImageMerge runtime folder: {runtime_dir}')

              archive_name = f'ImageMerge-SDK-{os_name}-{arch}'
              staging_root = root / 'zip_staging' / archive_name / 'ImageMerge-SDK'
              if staging_root.parent.exists():
                  shutil.rmtree(staging_root.parent)
              (staging_root / 'include').mkdir(parents=True)
              (staging_root / 'lib').mkdir()
              shutil.copytree(runtime_dir, staging_root / 'runtime' / 'ImageMerge')
              shutil.copy2(sdk_root / 'include' / 'imagemerge.h', staging_root / 'include')
              shutil.copy2(sdk_root / 'README.md', staging_root)
              shutil.copytree(sdk_root / 'examples', staging_root / 'examples')
              shutil.copy2(library, staging_root / 'lib')

              if os_name == 'windows':
                  import_lib = release_dir / 'imagemerge.dll.lib'
                  if not import_lib.is_file():
                      raise FileNotFoundError(f'Missing Windows import library: {import_lib}')
                  shutil.copy2(import_lib, staging_root / 'lib' / 'imagemerge.lib')

              shutil.make_archive(
                  str(out / archive_name),
                  'zip',
                  root_dir=staging_root.parent,
                  base_dir='ImageMerge-SDK',
              )
              shutil.rmtree(staging_root.parent, ignore_errors=True)

          def first_existing(candidates):
              for candidate in candidates:
                  if candidate.exists():
                      return candidate
              return None

          if runner == 'Windows':
              arch = normalize_arch(os.environ.get('PROCESSOR_ARCHITECTURE', ''))
              dist_dir = first_existing([
                  root / 'dist' / 'windows' / 'MainApp.dist',
                  root / 'dist' / 'windows' / 'ImageMerge.dist',
              ])
              if dist_dir is None:
                  raise FileNotFoundError('Missing Windows dist folder (MainApp.dist/ImageMerge.dist)')
              zip_dir(f'ImageMerge-windows-{arch}', dist_dir, 'ImageMerge')
              zip_native_sdk('windows', arch, 'imagemerge.dll', dist_dir)

          elif runner == 'Linux':
              import platform
              arch = normalize_arch(platform.machine())
              dist_dir = first_existing([
                  root / 'dist' / 'linux' / 'MainApp.dist',
                  root / 'dist' / 'linux' / 'ImageMerge.dist',
              ])
              if dist_dir is None:
                  raise FileNotFoundError('Missing Linux dist folder (MainApp.dist/ImageMerge.dist)')
              zip_dir(f'ImageMerge-linux-{arch}', dist_dir, 'ImageMerge')
              zip_native_sdk('linux', arch, 'libimagemerge.so', dist_dir)
          elif runner == 'macOS':
              import platform
              arch = normalize_arch(platform.machine())
              dist_dir = first_existing([
                  root / 'dist' / 'macos-binary' / 'MainApp.dist',
                  root / 'dist' / 'macos-binary' / 'ImageMerge.dist',
              ])
              if dist_dir is None:
                  raise FileNotFoundError('Missing macOS binary dist folder (MainApp.dist/ImageMerge.dist)')
              zip_dir(f'ImageMerge-macos-binary-{arch}', dist_dir, 'ImageMerge')
              zip_native_sdk('macos', arch, 'libimagemerge.dylib', dist_dir)

              app_candidates = sorted((root / 'dist' / 'macos-app').glob('*.app'))
              if not app_candidates:
                  raise FileNotFoundError('Missing macOS app bundle (*.app) in dist/macos-app')
              zip_dir(f'ImageMerge-macos-app-{arch}', app_candidates[0], 'ImageMerge.app')
          else:
              raise RuntimeError(f'Unsupported RUNNER_OS: {runner}')
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.os }}
          path: release_assets/*
          if-no-files-found: error

  publish:
    name: Create draft release
    runs-on: ubuntu-latest
    needs: [validate, build]
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true
          path: release_files

      - name: Checkout release notes
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.tag }}
          path: release_source

      - name: Prepare release notes for this version
        id: notes
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          content = Path("release_source/Releases.md").read_text(encoding="utf-8")
          entries = list(re.finditer(r"(?m)^Tag: ([^\r\n]+)\s*$", content))

          for index, entry in enumerate(entries):
              if entry.group(1).strip() != tag:
                  continue

              end = entries[index + 1].start() if index + 1 < len(entries) else len(content)
              section = content[entry.start():end]
              title_match = re.search(r"(?m)^Release title: ([^\r\n]+)\s*$", section)
              notes_match = re.search(r"(?m)^Release notes:\s*$", section)
              if title_match is None or notes_match is None:
                  raise SystemExit(f"{tag} must include Release title and Release notes in Releases.md")

              note_lines = section[notes_match.end():].splitlines()
              while note_lines and not note_lines[-1].strip():
                  note_lines.pop()
              if note_lines and note_lines[-1].strip() == "---":
                  note_lines.pop()
              notes = "\n".join(note_lines).strip()
              if not notes:
                  raise SystemExit(f"No release notes found for {tag} in Releases.md")

              Path("release_notes.md").write_text(notes + "\n", encoding="utf-8")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"name={title_match.group(1).strip()}\n")
              print(f"Prepared release title and notes for {tag}.")
              break
          else:
              raise SystemExit(f"No entry for {tag} found in Releases.md")
          PY

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd release_files
          sha256sum ImageMerge-* > SHA256SUMS

      - name: Import GPG keys (Linux + Windows)
        shell: bash
        env:
          GPG_PRIVATE_LINUX: ${{ secrets.GPG_PRIVATE_LINUX }}
          GPG_PRIVATE_WIN: ${{ secrets.GPG_PRIVATE_WIN }}
        run: |
          for name in GPG_PRIVATE_LINUX GPG_PRIVATE_WIN; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name"
              exit 1
            fi
          done
          # Read each key's fingerprint before importing so the two keys can be told apart.
          key_fpr() {
            printf '%s' "$1" | gpg --batch --with-colons --import-options show-only --import 2>/dev/null |
              awk -F: '$1=="sec"{f=1;next} f && $1=="fpr"{print $10; exit}'
          }
          GPG_KEY_ID_LINUX="$(key_fpr "$GPG_PRIVATE_LINUX")"
          GPG_KEY_ID_WIN="$(key_fpr "$GPG_PRIVATE_WIN")"
          if [ -z "$GPG_KEY_ID_LINUX" ] || [ -z "$GPG_KEY_ID_WIN" ]; then
            echo "Could not determine key ID from GPG_PRIVATE_LINUX / GPG_PRIVATE_WIN."
            exit 1
          fi
          # Make the derived IDs available to later steps.
          echo "GPG_KEY_ID_LINUX=$GPG_KEY_ID_LINUX" >> "$GITHUB_ENV"
          echo "GPG_KEY_ID_WIN=$GPG_KEY_ID_WIN" >> "$GITHUB_ENV"
          printf '%s' "$GPG_PRIVATE_LINUX" | gpg --batch --import
          printf '%s' "$GPG_PRIVATE_WIN" | gpg --batch --import

      - name: Sign SHA256SUMS with both GPG keys
        shell: bash
        env:
          GPG_PASSPHRASE_LINUX: ${{ secrets.GPG_PASSPHRASE_LINUX }}
          GPG_PASSPHRASE_WIN: ${{ secrets.GPG_PASSPHRASE_WIN }}
        run: |
          for name in GPG_PASSPHRASE_LINUX GPG_PASSPHRASE_WIN GPG_KEY_ID_LINUX GPG_KEY_ID_WIN; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name"
              exit 1
            fi
          done
          cd release_files
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE_LINUX" \
            --local-user "$GPG_KEY_ID_LINUX" \
            --armor --detach-sign \
            --output SHA256SUMS.asc \
            SHA256SUMS
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE_WIN" \
            --local-user "$GPG_KEY_ID_WIN" \
            --armor --detach-sign \
            --output SHA256SUMS-win.asc \
            SHA256SUMS

      - name: Export public GPG keys
        shell: bash
        run: |
          gpg --batch --yes --armor --export "$GPG_KEY_ID_LINUX" > release_files/GPG-KEY.asc
          gpg --batch --yes --armor --export "$GPG_KEY_ID_WIN" > release_files/GPG-KEY-win.asc

      - name: Upload assets to draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: ${{ steps.notes.outputs.name }}
          draft: true
          body_path: release_notes.md
          files: release_files/*